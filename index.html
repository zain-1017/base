      s:'Carried forward '+c.cycles+' payments since '+c.balanceFrom+' — now reads '+money(c.settle),
      warn:c.cycles>=4});
  });
  if(D.debts.length&&debtsRated()<D.debts.length)
    alerts.push({t:(D.debts.length-debtsRated())+' debts have no interest rate',
      s:'Balances show payments left, not what it costs to clear them'});
  if(!todays.length)alerts.push({t:'Nothing written down today',s:'Spends, notes, anything — the page above'});

  const pin=D.targets.find(t=>t.pinned)||D.targets[0];

  let h=`<div class="top"><h1>${DAYS[now.getDay()]}</h1>
    <div class="meta">${dayNow} ${MONS[now.getMonth()].toUpperCase()}</div></div>
  <div class="cap">
    <textarea id="capin" rows="1" placeholder="Write it down…" oninput="onDraft(this.value,this)"
      onkeydown="if(event.key==='Enter'&&(event.metaKey||event.ctrlKey))addEntry()"></textarea>
    <div class="caprow">
      <div class="hint">Put <b>£</b> in the line and it files as a spend. Everything else keeps as a note.</div>
      <button class="add" id="capadd" onclick="addEntry()" ${DRAFT.trim()?'':'disabled'}>ADD</button>
    </div>
  </div>

  <div class="hero">
    <div class="v${net<0?' neg':''}">${money(net)}</div>
    <div class="u">NET THIS MONTH · <b>${money(+D.settings.wage||0)}</b> IN · <b>${money(outgoings())}</b> OUT</div>
  </div>
  <div class="strip">
    <div><div class="n">${money(paidSum)}</div><div class="l">PAID · ${paidLines.length}/${lines.length}</div></div>
    <div><div class="n">${money(monthlyTotal()-paidSum)}</div><div class="l">STILL TO GO</div></div>
    <div><div class="n">${money(debtSettle())}</div><div class="l">DEBT LEFT</div></div>
  </div>`;

  if(alerts.length){
    h+=`<div class="lab">Needs you today</div>`;
    alerts.forEach(a=>{h+=`<div class="row"><span class="dot${a.warn?' due':''}"></span>
      <div class="nm">${esc(a.t)}<i${a.warn?' class="warn"':''}>${esc(a.s)}</i></div></div>`;});
  }

  if(todays.length){
    h+=`<div class="lab">Today's page<span class="r">${todays.length} ${todays.length>1?'ENTRIES':'ENTRY'}</span></div>`;
    todays.forEach(e=>{
      const tm=new Date(e.ts);
      h+=`<div class="ent"><span class="tm">${String(tm.getHours()).padStart(2,'0')}:${String(tm.getMinutes()).padStart(2,'0')}</span>
        <span class="tx">${esc(e.text)}</span>
        ${e.amount!=null?`<span class="am">${money(e.amount,e.amount%1!==0)}</span>`:''}
        <button class="rm" onclick="delEntry('${e.id}')" aria-label="Delete entry">✕</button></div>`;
    });
    if(spend>0)h+=`<div class="row"><div class="nm">Tracked this month</div>
      <span class="v">${money(spend,spend%1!==0)}</span></div>`;
  }

  if(D.exercises.length&&D.logs.length){
    h+=`<div class="lab">This week<span class="r">${doneDays} OF 6</span></div>
      <div class="row tap" onclick="go('health')"><div class="nm" style="display:flex;gap:5px">${
      week.map(w=>`<span style="flex:1;height:22px;border-radius:5px;display:flex;align-items:center;
        justify-content:center;font-size:9px;font-weight:800;
        background:${w.done?'var(--ink)':'var(--hl)'};color:${w.done?'var(--bg)':'var(--dim)'};
        border:1px solid ${w.done?'var(--ink)':'var(--line)'}">${DOW[week.indexOf(w)]}</span>`).join('')
      }</div></div>`;
  }

  if(soon.length){
    h+=`<div class="lab">Next seven days<span class="r">${money(sum(soon,s=>billAmount(s.l)))}</span></div>`;
    soon.forEach(s=>{
      h+=`<div class="row"><span class="d">${s.annual?MONS[(s.l.month|0)-1].toUpperCase():s.l.day}</span>
        <div class="nm">${esc(s.l.name)}<i>${s.in===0?'Today':s.in===1?'Tomorrow':'In '+s.in+' days'}${
          s.annual?' · annual':isForecast(s.l)?' · this month\'s minimum':''}</i></div>
        <span class="v">${money(billAmount(s.l))}</span></div>`;
    });
  }

  if(pin){
    const p=goalProgress(pin);
    h+=`<div class="lab">Pinned</div>
      <button class="quest pin" onclick="go('goals')">
        <div class="qh"><span class="nm">${esc(pin.name)}</span><span class="pct">${p.label}</span></div>
        <div class="l2" style="display:flex;align-items:center;gap:9px">
          <span style="font-size:9.5px;font-weight:800;color:var(--mut);letter-spacing:.3px;width:104px;flex-shrink:0">${p.sub}</span>
          <span class="bar"><i style="width:${pct(p.pct)}"></i></span></div>
      </button>`;
  }
  return h+`<div class="spacer"></div>`;
}

/* ═══ MONEY ═══════════════════════════════════════════════════
   The order is the order of the questions: what do I need for this period,
   what are the fixed bills, what do the variable ones actually cost, and
   what does the month come to. Everything after that is reference and
   stays folded until asked for. */
function renderMoney(){
  const now=new Date(),ym=ymOf(today()),dayNow=now.getDate();
  const dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  const rows=rangeRows(1,dim),unpaid=rows.filter(r=>!r.paid);
  const left=sum(unpaid,r=>r.amount);
  const overdue=unpaid.filter(r=>r.due);
  const month=rows;
  const paidSum=sum(rows.filter(r=>r.paid),r=>r.amount);

  /* A separate question with its own answer: what do I need between any two
     days. It reads off the same bills but does not touch the list — the list
     is always the month. */
  if(!RFROM)RFROM=dayNow;
  if(!RTO)RTO=dim;
  const rangeAll=!!D.settings.rangeAll;
  const span=sum(rangeRows(RFROM,RTO).filter(r=>rangeAll||!r.paid),r=>r.amount);

  let dp=D.settings.payday|0||1,dd=dp-dayNow;
  if(dd<0)dd+=dim;

  const bills=monthlyTotal(),ann=annualPerMonth();
  const food=+D.settings.food||0,fuel=+D.settings.fuel||0;
  const out=bills+food+fuel+ann,wage=+D.settings.wage||0,net=wage-out;

  let h=`<div class="top"><h1>${MONS[now.getMonth()]}</h1>
    <div class="meta"><button class="${MANAGE?'on':''}" onclick="toggleManage()">${MANAGE?'DONE':'EDIT'}</button>
      &nbsp;·&nbsp;${dd===0?'PAYDAY':dd+' TO PAYDAY'}</div></div>
  <div class="hero">
    <div class="v">${money(left,left%1!==0)}</div>
    <div class="u">STILL TO PAY THIS MONTH · <b>${unpaid.length}</b> OF ${rows.length} BILLS${
      unpaid.length?` · NEXT IS ${esc(unpaid[0].l.name).toUpperCase()} ON THE ${ordinal(unpaid[0].day).toUpperCase()}`:''}</div>
  </div>
  <div class="strip">
    <button class="cell" onclick="savingsSheet()"><div class="n">${money(+D.settings.savings||0)}</div>
      <div class="l">BANK ›</div></button>
    <div><div class="n ${net<0?'neg':'pos'}">${money(net)}</div><div class="l">NET</div></div>
  </div>
  <div class="range">
    <input type="number" inputmode="numeric" min="1" max="31" value="${RFROM}"
      aria-label="From day of the month" onchange="setRange('from',this.value)">
    <label>to</label>
    <input type="number" inputmode="numeric" min="1" max="31" value="${RTO}"
      aria-label="To day of the month" onchange="setRange('to',this.value)">
    <button class="rmode${rangeAll?' on':''}" onclick="toggleRangeMode()"
      aria-pressed="${rangeAll}">${rangeAll?'ALL BILLS':'TO PAY'}</button>
    <span class="rtot">${money(span,span%1!==0)}</span>
  </div>

  <div class="lab tight">Monthly bills<span class="r">${
      (+D.settings.roundTo||0)?'ROUNDED UP TO £'+(+D.settings.roundTo)+' · ':''}${month.length}</span>
    <button onclick="gridSheet('ledger')">GRID</button></div>`;

  if(MANAGE){
    monthlyLines().forEach(l=>{
      h+=`<div class="row">
        <input class="inl dy" type="number" inputmode="numeric" min="1" max="31" value="${l.day}"
          aria-label="Day for ${esc(l.name)}" onchange="quickSet('${l.id}','day',this.value)">
        <input class="inl nm2" value="${esc(l.name)}" aria-label="Name"
          onchange="quickSet('${l.id}','name',this.value)">
        ${isForecast(l)?`<span class="v" style="width:74px;text-align:right">${money(billAmount(l))}</span>`
          :`<input class="inl amt" type="number" inputmode="decimal" step="0.01" value="${l.amount}"
             aria-label="Amount" onchange="quickSet('${l.id}','amount',this.value)">`}
        <button class="rm" onclick="quickDel('${l.id}')" aria-label="Delete ${esc(l.name)}">✕</button></div>`;
    });
    h+=`<div class="row" style="gap:7px">
      <input class="inl dy" type="number" inputmode="numeric" min="1" max="31" id="q-day" placeholder="1" aria-label="New bill day">
      <input class="inl nm2" id="q-name" placeholder="New bill" aria-label="New bill name"
        onkeydown="if(event.key==='Enter')quickAdd()">
      <input class="inl amt" type="number" inputmode="decimal" step="0.01" id="q-amt" placeholder="0" aria-label="New bill amount"
        onkeydown="if(event.key==='Enter')quickAdd()">
      <button class="rm" onclick="quickAdd()" aria-label="Add bill" style="color:var(--ink)">+</button></div>
    <div class="gnote">Tap any field to change it. <b>Grid</b> opens all of them at once and takes a
      paste straight from a spreadsheet.</div>`;
  }else{
    h+=`<div class="bhead"><span></span><span>Day</span><span>Bill</span>
      <span class="r">Amount</span><span class="r">Need by</span></div>`;
    let rolled=false;
    rows.forEach(r=>{
      const l=r.l;
      if(r.next&&!rolled){rolled=true;h+=`<div class="bmon">Next month</div>`;}
      h+=`<div class="brow${r.paid?' done':''}${r.today?' today':''}">
        <button class="dot${r.paid?'':r.due?' o due':' o'}" onclick="togglePaid('${l.id}')"
          aria-label="Mark ${esc(l.name)} ${r.paid?'unpaid':'paid'}" style="padding:0"
          ${r.next?'disabled':''}></button>
        <span class="dy">${r.day}</span>
        <button class="nm" onclick="editLedger('${l.id}')">${esc(l.name)}</button>
        <span class="am">${money(r.amount,r.amount%1!==0)}</span>
        <span class="rn">${r.paid?'':money(r.running,r.running%1!==0)}</span></div>`;
    });
    h+=`<div class="row tap"><button class="nm" onclick="editLedger(null,'monthly')"
      style="text-align:left;color:var(--mut)">+ Add a bill</button></div>`;
    if(overdue.length)h+=`<div class="gnote"><b>${overdue.length} bill${overdue.length>1?'s are':' is'}
      past its date and not ticked off.</b> Tap the circle to mark it paid, or leave it if it really
      has not gone out.</div>`;
    else if(!unpaid.length)h+=`<div class="gnote">Nothing left to pay between the
      ${ordinal(RFROM)} and the ${ordinal(RTO)}.</div>`;
  }

  /* Food and fuel are the two lines nobody has receipts for, so they sit right
     under the bills where they can be corrected. */
  h+=`<div class="lab tight">Food and fuel<span class="r">${money(food+fuel)}/MO</span></div>`;
  [['food','Food'],['fuel','Fuel']].forEach(([k,name])=>{
    const budget=+D.settings[k]||0,spent=spentThisMonth(k),avg=spendAverage(k);
    const over=budget>0&&spent>budget;
    /* Only say something when there is something to say. */
    const note=spent>0?money(spent)+' so far'+(avg!=null?' · '+money(avg)+' average':'')
              :avg!=null?money(avg)+' average':'';
    h+=`<button class="vrow" onclick="variableSheet('${k}')">
      <div class="vn">${name}</div>
      <div class="vv"><span class="b">${money(budget)}</span>
        ${note?`<span class="s${over?' crit':''}">${note}</span>`:''}</div>
      <span class="arrow">›</span></button>`;
  });

  h+=fold('annual','Other payments',money(ann,true)+'/MO',()=>{
    let a=`<div class="row tap"><button class="nm" onclick="editLedger(null,'annual')"
      style="text-align:left;color:var(--mut)">+ Add an annual bill</button></div>`;
    annualLines().forEach(l=>{
      a+=`<div class="row tap"><span class="d">${MONS[(l.month|0)-1]||'—'}</span>
        <button class="nm" onclick="editLedger('${l.id}')" style="text-align:left">${esc(l.name)}</button>
        <span class="v">${money(l.amount)}<span style="font-size:10px;color:var(--mut)">/yr</span></span></div>`;
    });
    return a+`<div class="gnote">Annual bills are spread across twelve months so they never
      arrive as a surprise. ${money(annualTotal())} a year is ${money(ann,true)} a month.</div>`;
  },true);

  /* The number he is trying to move. */
  h+=`<div class="lab tight">The month</div>
  <div class="total">
    <div class="tr"><span>Monthly bills</span><b>${money(bills,true)}</b></div>
    <div class="tr"><span>Food and fuel</span><b>${money(food+fuel,true)}</b></div>
    <div class="tr"><span>Annual bills, monthly share</span><b>${money(ann,true)}</b></div>
    <div class="tr sum"><span>Total costs</span><b>${money(out,true)}</b></div>
    <div class="tr sum"><span>Wage</span><b>${money(wage,true)}</b></div>
    <div class="tr sum net"><span>Net</span><b class="${net<0?'neg':'pos'}">${money(net,true)}</b></div>
  </div>`;

  h+=fold('debt','Debt',money(debtSettle())+' · '+money(debtService())+'/MO',
    ()=>renderDebts()+renderProjection());
  h+=fold('subs','Subscriptions',(()=>{
      const subs=activeLedger().filter(l=>(l.tags||[]).includes('sub'));
      const mo=sum(subs,l=>l.cadence==='annual'?l.amount/12:l.amount);
      return money(mo)+'/MO · '+money(mo*12)+'/YR';
    })(),()=>{
    const subs=activeLedger().filter(l=>(l.tags||[]).includes('sub'))
      .sort((a,b)=>b.amount-a.amount);
    if(!subs.length)return `<div class="row"><div class="nm" style="color:var(--mut)">Nothing tagged as a subscription</div></div>`;
    return subs.map(l=>{
      const mo=l.cadence==='annual'?l.amount/12:l.amount;
      return `<div class="row tap"><button class="nm" onclick="editLedger('${l.id}')"
        style="text-align:left">${esc(l.name)}</button>
        <span class="v mut" style="font-size:11px">${money(mo*12)}/yr</span>
        <span class="v">${money(l.amount)}</span></div>`;
    }).join('');
  });
  h+=fold('nums','Your numbers','',()=>settingsRows(fuelLast30()));

  return h+`<div class="spacer"></div>`;
}

/* A section that stays out of the way until asked for, but still says what it
   holds while it is shut. */
function fold(key,title,right,body,tight){
  const open=!!(D.settings.open||{})[key];
  return `<button class="lab foldable${tight?' tight':''}" onclick="toggleFold('${key}')" aria-expanded="${open}">
      ${title}<span class="r">${right}</span>
      <svg class="fchev${open?' on':''}" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
    </button>${open?body():''}`;
}
function toggleFold(k){
  D.settings.open=D.settings.open||{};
  D.settings.open[k]=!D.settings.open[k];
  save();haptic(5);render();
}
function setRange(which,v){
  const n=clamp(parseInt(v)||1,1,31);
  if(which==='from')RFROM=n;else RTO=n;
  haptic(4);render();
}
/* Two questions the same days can answer: what is still to find, or what the
   period costs whether or not it has gone out yet. */
function toggleRangeMode(){D.settings.rangeAll=!D.settings.rangeAll;save();haptic(4);render();}
function resetRange(){
  const n=new Date();
  RFROM=n.getDate();RTO=new Date(n.getFullYear(),n.getMonth()+1,0).getDate();
  haptic(5);render();
}

function renderDebts(){
  if(!D.debts.length)
    return `<div class="row tap"><button class="nm" onclick="editDebt(null)"
      style="text-align:left;color:var(--mut)">+ Add a debt</button></div>`;

  const rated=debtsRated(),il=debtInterestLeft();
  let h='';

  D.debts.slice().sort((a,b)=>debtCalc(a).left-debtCalc(b).left).forEach(d=>{
    const c=debtCalc(d);
    h+=`<button class="dbt" onclick="editDebt('${d.id}')">
      <div class="l1"><span class="nm">${esc(d.name)}</span>
        ${c.ratedKnown?`<span class="tag">${(+d.apr).toFixed(1)}% APR</span>`:`<span class="tag">NO RATE</span>`}
        <span class="v">${c.done?'Cleared':money(c.settle)}</span></div>
      <div class="l2"><span class="mo">${c.done?'DONE':isFinite(c.left)
        ?(c.left>60?(c.left/12).toFixed(0)+' YEARS':c.left+' MO · '+c.freeLabel.toUpperCase())
        :'NEVER CLEARS'}</span>
        <span class="bar"><i style="width:${pct(c.progress)}"></i></span>
        <span class="up">${c.done?'':'+'+money(linkedBill(d))}</span></div>
      ${c.done?'':`<div class="l3">
        <div><div class="n">${money(c.settle)}</div><div class="k">CLEAR TODAY</div></div>
        <div><div class="n">${isFinite(c.paymentsLeft)?money(c.paymentsLeft):'∞'}</div><div class="k">PAY IT OUT</div></div>
        <div><div class="n${c.interestLeft>0?' crit':''}">${
          c.ratedKnown?(isFinite(c.interestLeft)?money(c.interestLeft):'∞'):'—'}</div>
          <div class="k">INTEREST LEFT</div></div></div>
        ${c.revolving?`<div class="l4">${
          c.stalled?`Your payment doesn't cover the ${money(c.interestNow)} of interest — this one grows.`
          :`${money(c.interestNow)} of every ${money(c.payment)} payment${c.usingMin?' (the minimum)':''} is interest. ${
            money(Math.max(0,c.payment-(+d.spend||0)-c.interestNow))} comes off the balance.${
            c.usingMin?` The same money as a standing order would clear it in ${
              runDown(c.settle,monthlyRate(d.apr),c.minPay,+d.spend||0,2400).months} months.`:''}`}</div>`:''}`}
    </button>`;
  });

  D.debts.filter(d=>!debtCalc(d).done).forEach(d=>{
    const c=debtCalc(d);
    const n=c.revolving?minSchedule(d,1)[0]:null;
    if(c.revolving&&!n)return;
    h+=`<div class="row tap"><button class="nm" onclick="payDebt('${d.id}')" style="text-align:left">
      Record a ${esc(d.name)} payment<i>${n?'Next due '+money(n.due,true)+' · '+n.label
        :c.paid+' of '+c.months+' paid · '+money(+d.monthly||0)+' each'}</i></button>
      ${c.revolving?`<button class="v mut" onclick="scheduleSheet('${d.id}')">SCHEDULE ›</button>`:''}</div>`;
  });
  h+=`<div class="row tap"><button class="nm" onclick="editDebt(null)"
    style="text-align:left;color:var(--mut)">+ Add a debt</button></div>`;
  h+=`<div class="gnote">`;
  if(rated<D.debts.length)
    h+=`<b>${D.debts.length-rated} of ${D.debts.length} have no rate set.</b> Until they do, "clear today" just
        repeats the payments left — the app won't guess a rate it wasn't given. Open one and enter what you
        actually borrowed; it works the APR out from that.`;
  else
    h+=`Clearing everything today would cost <b>${money(debtSettle())}</b> against <b>${money(debtPaymentsLeft())}</b>
        of remaining payments. <b>${money(il)}</b> of that is interest you have not paid yet — which is what any
        overpayment is really buying back.`;
  const stuck=D.debts.filter(d=>debtCalc(d).stalled);
  if(stuck.length)h+=` <b>${stuck.map(d=>esc(d.name)).join(', ')}</b> ${stuck.length>1?'are':'is'} growing:
    the payment doesn't cover the interest.`;
  return h+`</div>`;
}

/* Net position over five years. One scale, every riser is a debt ending,
   and the zero crossing is called out because it's the date the page is about. */
function renderProjection(){
  if(!D.debts.some(d=>!debtCalc(d).done))return '';
  const p=projection(60);
  if(!p.length)return '';
  const W=340,H=118,PADL=6,PADR=6,top=10,bot=88;
  const vals=p.map(x=>x.net),lo=Math.min.apply(null,vals.concat([0])),hi=Math.max.apply(null,vals.concat([0]));
  const span=(hi-lo)||1;
  const X=i=>PADL+(i/(p.length-1))*(W-PADL-PADR);
  const Y=v=>bot-((v-lo)/span)*(bot-top);
  let d='M'+X(0)+','+Y(p[0].net);
  for(let i=1;i<p.length;i++){
    if(p[i].net!==p[i-1].net)d+=' L'+X(i)+','+Y(p[i-1].net);
    d+=' L'+X(i)+','+Y(p[i].net);
  }
  const zero=Y(0),cross=p.findIndex(x=>x.net>=0);
  const risers=[];
  D.debts.forEach(dd=>{
    const c=debtCalc(dd);if(c.done)return;
    const i=p.findIndex(x=>x.y>c.freeY||(x.y===c.freeY&&x.m>=c.freeM));
    if(i>0)risers.push({i:i,name:dd.name,label:c.freeLabel});
  });
  const yrs=[];p.forEach((x,i)=>{if(x.m===0)yrs.push({i:i,y:x.y});});

  return `<div class="lab">If nothing changes<span class="r">5 YEARS</span></div>
  <div class="chart">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly net position projected over five years, rising each time a debt clears">
      ${lo<0&&hi>0?`<line x1="${PADL}" y1="${zero}" x2="${W-PADR}" y2="${zero}" stroke="var(--line2)" stroke-width="1" stroke-dasharray="2 3"/>
      <text x="${PADL}" y="${zero-4}" fill="var(--dim)" font-size="7" font-weight="700">£0</text>`:''}
      <path d="${d}" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-linejoin="miter"/>
      ${risers.map(r=>`<circle cx="${X(r.i)}" cy="${Y(p[r.i].net)}" r="2" fill="var(--ink)"/>`).join('')}
      <circle cx="${X(0)}" cy="${Y(p[0].net)}" r="2.4" fill="${p[0].net<0?'var(--crit)':'var(--pos)'}"/>
      ${yrs.map(v=>`<line x1="${X(v.i)}" y1="${bot+2}" x2="${X(v.i)}" y2="${bot+5}" stroke="var(--line2)" stroke-width="1"/>
        <text x="${X(v.i)}" y="${H-2}" fill="var(--dim)" font-size="7" font-weight="700" text-anchor="middle">${v.y}</text>`).join('')}
    </svg>
    <div class="cx">Today <b>${money(p[0].net)}</b> a month${
      cross>0?` · turns positive <b>${monLabel(p[cross].y,p[cross].m)}</b>`:cross===0?' · already positive':''
      } · <b>${money(p[p.length-1].net)}</b> by ${monLabel(p[p.length-1].y,p[p.length-1].m)}.
      ${risers.length?'Each step is a debt ending: '+risers.map(r=>esc(r.name)+' '+r.label).join(', ')+'.':''}</div>
  </div>`;
}

function settingsRows(f30){
  const s=D.settings;
  const f=(k,t,d)=>`<div class="sr"><div class="l"><div class="t">${t}</div><div class="d">${d}</div></div>
    <input class="numin" type="number" inputmode="decimal" value="${s[k]}" aria-label="${t}"
      onchange="setNum('${k}',this.value)"></div>`;
  const r=+s.roundTo||0;
  return `<div class="sr"><div class="l"><div class="t">Round bills up</div>
      <div class="d">${r?'Every bill rounded up to the nearest £'+r+'. A cushion for the month — what you typed is untouched.'
        :'Bills show their exact amounts.'}</div></div>
      <button class="cyc" onclick="cycleRound()">${r?'£'+r:'OFF'}</button></div>`
    +f('wage','Monthly wage','What actually lands, after tax')
    +f('savings','Savings balance','Update whenever you move money')
    +f('payday','Payday','Day of the month the wage arrives')
    +`<div class="sr"><div class="l"><div class="t">Back up your data</div>
      <div class="d">${D.entries.length} entries · ${D.ledger.length} bills · ${D.debts.length} debts · ${D.logs.length} training logs. This device only.</div></div>
      <button class="arrow" onclick="dataSheet()" aria-label="Data options">›</button></div>`;
}
function setNum(k,v){D.settings[k]=parseFloat(v)||0;save();render();}

/* Food and fuel start as budgets. Log what actually goes out and the average
   turns them into measurements — which is the only way the net figure below
   them ever becomes true. */
function savingsSheet(){
  form({
    title:'Savings',
    sub:'What you have put aside. Nothing tracks this automatically, so update it whenever you move money.',
    value:{savings:+D.settings.savings||0,savingsGoal:+D.settings.savingsGoal||0},
    fields:[
      {k:'savings',label:'Balance £',type:'number',step:'0.01',half:true},
      {k:'savingsGoal',label:'Goal £',type:'number',step:'0.01',half:true}
    ],
    save:v=>{D.settings.savings=+v.savings||0;D.settings.savingsGoal=+v.savingsGoal||0;}
  });
}
function variableSheet(kind){
  const name=kind==='food'?'Food':'Fuel';
  const budget=+D.settings[kind]||0,spent=spentThisMonth(kind),avg=spendAverage(kind);
  const logs=D.spends.filter(x=>x.kind===kind).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10);
  const fromCar=kind==='fuel'
    ? D.fuel.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6) : [];
  openSheet(`<h2>${name}</h2>
    <div class="sub">A budget until something is logged against it. Put what you actually spend in here
      and the average tells you what it really costs.${
      kind==='fuel'?' Fill-ups recorded on the Car page count here too, so they need not be typed twice.':''}</div>
    <div class="ef"><label>Monthly budget £</label>
      <input id="v-budget" type="number" inputmode="decimal" step="0.01" value="${budget}"
        onchange="setNum('${kind}',this.value);variableSheet('${kind}')"></div>
    <div class="kv"><span class="k">Logged this month</span>
      <span class="v${budget&&spent>budget?' crit':''}">${money(spent,true)}</span></div>
    <div class="kv"><span class="k">Average a full month</span>
      <span class="v">${avg!=null?money(avg,true):'nothing complete yet'}</span></div>
    ${budget&&avg!=null?`<div class="kv"><span class="k">Budget against that average</span>
      <span class="v${avg>budget?' crit':' pos'}">${avg>budget
        ?money(avg-budget,true)+' a month short':money(budget-avg,true)+' a month spare'}</span></div>`:''}
    <div class="brk"><div class="bh">Log a spend</div>
      <div class="efr">
        <div class="ef"><label>Amount £</label>
          <input id="v-amt" type="number" inputmode="decimal" step="0.01" placeholder="0"></div>
        <div class="ef"><label>Date</label><input id="v-date" type="date" value="${today()}"></div>
      </div>
      <div class="ef"><label>What for</label>
        <input id="v-note" placeholder="${kind==='food'?'Weekly shop':'Filled up'}"
          onkeydown="if(event.key==='Enter')addSpend('${kind}')"></div>
      <div class="srow"><button class="sbtn solid" onclick="addSpend('${kind}')">Add it</button></div>
    </div>
    ${(logs.length||fromCar.length)?`<div class="brk"><div class="bh">Recent</div>
      ${fromCar.map(f=>`<div class="kv"><span class="k">${f.date} · fill-up, from Car</span>
        <span class="v">${money(f.cost,true)}</span></div>`).join('')}
      ${logs.map(x=>`<div class="kv"><span class="k">${x.date}${x.note?' · '+esc(x.note):''}</span>
        <span class="v">${money(x.amount,true)}<button onclick="delSpend('${x.id}','${kind}')"
          aria-label="Remove" style="color:var(--dim);padding-left:9px;font-weight:700">✕</button></span></div>`).join('')}
    </div>`:''}
    <div class="srow"><button class="sbtn" onclick="closeSheet();render()">Done</button></div>`);
}
function addSpend(kind){
  const g=id=>document.getElementById(id);
  const amt=parseFloat(g('v-amt').value)||0;
  if(amt<=0){toast('How much was it?');return;}
  D.spends.push({id:uid('v'),kind:kind,date:g('v-date').value||today(),
                 amount:amt,note:(g('v-note').value||'').trim()});
  save();haptic(8);toast('Logged '+money(amt,amt%1!==0));variableSheet(kind);
}
function delSpend(id,kind){
  const i=D.spends.findIndex(x=>x.id===id);if(i<0)return;
  D.spends.splice(i,1);save();haptic(6);variableSheet(kind);
}
function cycleRound(){
  const opts=[0,1,5,10],i=opts.indexOf(+D.settings.roundTo||0);
  D.settings.roundTo=opts[(i+1)%opts.length];
  save();haptic(6);render();
}

/* ── fast bill edits ─────────────────────────────────────────── */
function quickSet(id,field,v){
  const l=D.ledger.find(x=>x.id===id);if(!l)return;
  if(field==='amount')l.amount=parseFloat(v)||0;
  else if(field==='day')l.day=clamp(parseInt(v)||1,1,31);
  else l[field]=v;
  save();render();
}
function quickDel(id){
  const i=D.ledger.findIndex(x=>x.id===id);if(i<0)return;
  const snap=D.ledger[i];D.ledger.splice(i,1);save();haptic(10);render();
  toast('Deleted '+snap.name,()=>{D.ledger.splice(Math.min(i,D.ledger.length),0,snap);save();render();});
}
function quickAdd(){
  const g=id=>document.getElementById(id);
  const name=(g('q-name').value||'').trim();
  if(!name){toast('Give it a name');g('q-name').focus();return;}
  D.ledger.push({id:uid('l'),name:name,amount:parseFloat(g('q-amt').value)||0,
    cadence:'monthly',day:clamp(parseInt(g('q-day').value)||1,1,31),
    tags:[],debtId:null,active:true});
  save();haptic(10);render();
  const n=document.getElementById('q-name');if(n)n.focus();
  toast('Added '+name);
}

/* ═══════════════════════════════════════════════════════════════
   HEALTH
   The sheet stays dense on purpose: the more lifts on screen, the faster the
   eye finds the one it wants mid-set. Three pages behind one tab — the sheet,
   the calendar, the food — and a bar of controls that stays put while you
   scroll, because you use it between sets rather than at the end.
   ═══════════════════════════════════════════════════════════════ */
let HSUB='gym', SW={run:false,base:0,t0:0}, TICK=null, SWTICK=null;

function renderHealth(){
  const nav=`<div class="hnav">${
    [['gym','Gym'],['cal','Calendar'],['food','Food']].map(([k,n])=>
      `<button class="${HSUB===k?'on':''}" onclick="setSub('${k}')">${n}</button>`).join('')}</div>`;
  if(HSUB==='cal')return nav+renderHistory();
  if(HSUB==='food')return nav+renderFood();
  return nav+renderGym();
}
function setSub(s){HSUB=s;OPEN=null;render();haptic(5);document.getElementById('app').scrollTop=0;}

function renderGym(){
  const q=Q.trim().toLowerCase();
  let list=D.exercises.filter(e=>!e.hidden);
  if(q)list=list.filter(e=>e.name.toLowerCase().includes(q)||(e.bp||'').toLowerCase().includes(q));
  else if(JUMP)list=list.filter(e=>e.cat===JUMP);

  let h=`<div class="search"><input value="${esc(Q)}" placeholder="Search ${D.exercises.length} lifts…"
      aria-label="Search exercises" oninput="onSearch(this.value)">
      ${Q?'<button class="x" onclick="onSearch(\'\')">CLEAR</button>':''}</div>
  <div class="jump">
    <button class="${!JUMP&&!q?'on':''}" onclick="setJump('')">ALL</button>
    ${CATS.map(c=>`<button class="${JUMP===c?'on':''}" onclick="setJump('${c}')">${c}</button>`).join('')}
  </div>`;

  if(!list.length)return h+`<div class="empty"><h3>Nothing matches</h3>
    <p>${q?'No lift called “'+esc(Q)+'”.':'Nothing in this group yet.'}</p></div>`;

  const cats=q?[null]:CATS.filter(c=>list.some(e=>e.cat===c));
  cats.forEach(cat=>{
    const inCat=cat?list.filter(e=>e.cat===cat):list;
    if(!inCat.length)return;
    if(cat){
      const shut=!!D.settings.collapsed[cat];
      h+=`<button class="grp${shut?' shut':''}" onclick="toggleCat('${cat}')" aria-expanded="${!shut}">
        <svg class="gchev" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
        <span class="gname">${cat}</span><span class="gcount">${inCat.length}</span></button>`;
      if(shut)return;
    }
    const bps=(BPS[cat]||[]).filter(b=>inCat.some(e=>e.bp===b));
    const groups=cat?bps.map(b=>[b,inCat.filter(e=>e.bp===b)]):[['RESULTS',inCat]];
    groups.forEach(([bp,exs])=>{
      h+=`<div class="bph"><b>${bp}</b><span class="num">1RM</span>
        <button class="num pctb" onclick="multSheet()">${pctLabel()}</button>
        <span class="num">DONE</span></div>`;
      exs.forEach(e=>{h+=renderRow(e);});
    });
  });
  return h+`<div class="wkpad"></div>`;
}
const workMult=()=>{const m=+D.settings.mult;return m>0&&m<=2?m:0.65;};
const pctLabel=()=>Math.round(workMult()*100)+'%';
/* The working weight the sheet prescribes: a percentage of the one-rep max,
   rounded to something the gym actually has on the rack. */
function workWeight(e){
  if(e.rec==null)return null;
  const w=(+e.rec||0)*workMult();
  return w>0?plate(w,e):null;
}
function multSheet(){
  form({
    title:'Working weight',
    sub:'Every lift’s working column is this share of its one-rep max. Change it here and the whole sheet moves.',
    value:{pct:Math.round(workMult()*1000)/10},
    fields:[{k:'pct',label:'Percentage of 1RM',type:'number',step:'0.5',
             note:'Your sheet used <b>65%</b>. Anything from 1 to 100.'}],
    save:v=>{const p=+v.pct||65;D.settings.mult=clamp(p,1,100)/100;}
  });
}

function renderRow(e){
  const open=OPEN===e.id;
  const last=lastSession(e,true);
  const target=workWeight(e);
  const done=last&&(last.sets||[]).length
    ? last.sets.map(s=>s.reps).join(',')
    : (e.reps?e.reps.join(','):null);
  const fresh=last&&last.date===today();
  return `<div class="r${open?' open':''}">
    <button class="r-main" onclick="toggleEx('${e.id}')" aria-expanded="${open}">
      <span class="r-nm">${esc(e.name)}</span>
      <span class="r-n ${e.rec!=null?'':'none'}">${e.rec!=null?fmtKg(e.rec):'—'}</span>
      <span class="r-n kg ${target!=null?'':'none'}">${target!=null?fmtKg(target):'—'}</span>
      <span class="r-n ${done?(fresh?'nx':''):'none'}">${done||'—'}</span>
    </button>${open?renderLogger(e):''}</div>`;
}
function toggleEx(id){
  OPEN=OPEN===id?null:id;haptic(5);render();
  if(OPEN){const el=document.querySelector('.r.open');
    if(el)el.scrollIntoView({block:'nearest',behavior:'smooth'});}
}

/* A draft is the set list you are part way through. It becomes a log the
   moment a set has reps in it, so nothing needs committing by hand. */
function draftFor(e){
  if(DRAFTS[e.id])return DRAFTS[e.id];
  const t=todayLog(e.id);
  if(t)return DRAFTS[e.id]={w:t.w,sets:(t.sets||[]).map(s=>({reps:s.reps,w:s.w}))};
  const target=workWeight(e);
  return DRAFTS[e.id]={w:target!=null?target:(e.w!=null?e.w:0),sets:[{reps:'',w:null}]};
}
function renderLogger(e){
  const dr=draftFor(e),time=isTime(e);
  const last=lastSession(e,false),est=estMax(e),best=bestEffort(e);
  const target=workWeight(e);
  const hist=logsFor(e.id).slice(0,5);
  const lastW=last?(last.sets&&last.sets[0]&&last.sets[0].w!=null?last.sets[0].w:last.w):null;

  let h=`<div class="log">
    <div class="lglab">Weight</div>
    <div class="lgw">
      <button class="stp" onclick="stepW('${e.id}',-1)" aria-label="Less">−</button>
      <input class="wnum" type="number" inputmode="decimal" value="${dr.w||0}"
        aria-label="Weight" onchange="setW('${e.id}',this.value)">
      <button class="stp" onclick="stepW('${e.id}',1)" aria-label="More">+</button>
      <span class="wu">${time?'SEC':isBw(e)?'+KG':'KG'}</span>
      ${lastW!=null&&Math.abs(lastW-(+dr.w||0))>0.01
        ?`<button class="wchip" onclick="setW('${e.id}',${lastW})">last ${fmtKg(lastW)}</button>`:''}
      ${target!=null&&Math.abs(target-(+dr.w||0))>0.01
        ?`<button class="wchip" onclick="setW('${e.id}',${target})">${pctLabel()} ${fmtKg(target)}</button>`:''}
    </div>
    <div class="lglab">Reps — type one box per set</div>
    <div class="lgs">`;
  dr.sets.forEach((s,i)=>{
    h+=`<input class="setbox${s.reps!==''&&s.reps!=null?' done':''}" type="number" inputmode="numeric"
      value="${s.reps}" aria-label="Set ${i+1}"
      onchange="setRep('${e.id}',${i},this.value)">`;
  });
  h+=`<button class="setadd" onclick="addSet('${e.id}')" aria-label="Another set">+</button></div>
    <div class="lgm">${
      [est?`est <b>${fmtKg(est)}kg</b>`:'',
       e.rec!=null?`1RM <b>${fmtKg(e.rec)}</b>`:'',
       best?`best <b>${fmtKg(best.w)}×${best.reps}</b>`:'',
       last?`last ${relDate(last.date)}`:''].filter(Boolean).join(' · ')}</div>
    <input class="lgn" value="${esc(e.note||'')}" placeholder="Notes"
      onchange="setNote('${e.id}',this.value)">`;
  if(hist.length){
    h+=`<div class="lgh">`;
    hist.forEach(l=>{
      h+=`<div class="lgr"><span class="d">${relDate(l.date)}</span>
        <span class="s">${(l.sets||[]).map(s=>s.reps).join(', ')}</span>
        <span class="w">${l.w!=null?fmtKg(l.w)+'kg':''}</span>
        <button class="x" onclick="delLog('${l.id}')" aria-label="Delete">✕</button></div>`;
    });
    h+=`</div>`;
  }
  return h+`<div class="lgacts">
    <button onclick="editExercise('${e.id}')">EDIT LIFT</button>
    <button onclick="toggleEx('${e.id}')">CLOSE</button></div></div>`;
}

function stepW(id,dir){
  const e=exById(id),dr=draftFor(e),i=incOf(e)||1;
  dr.w=Math.max(0,Math.round(((+dr.w||0)+dir*i)/i)*i);
  haptic(4);syncAndSave(e,dr);
}
function setW(id,v){
  const e=exById(id),dr=draftFor(e);
  dr.w=Math.max(0,parseFloat(v)||0);syncAndSave(e,dr);
}
/* Typing reps is the whole interaction: it logs the set, keeps an empty box
   ready for the next one, and clears the box to remove it again. */
function setRep(id,i,v){
  const e=exById(id),dr=draftFor(e);
  const n=v===''?'':Math.max(0,parseInt(v)||0);
  if(n===''||n===0){
    dr.sets.splice(i,1);
    if(!dr.sets.length)dr.sets.push({reps:'',w:null});
  }else{
    dr.sets[i].reps=n;
    if(dr.sets.every(s=>s.reps!==''&&s.reps!=null))dr.sets.push({reps:'',w:null});
    if(!D.workout)startWorkout(true);
    swReset(true);                        // the stopwatch doubles as the rest clock
    haptic([10,30,10]);
  }
  syncAndSave(e,dr);
}
function addSet(id){
  const dr=draftFor(exById(id));
  dr.sets.push({reps:'',w:null});haptic(4);render();
}
/* One place where a draft turns into stored history, so a set can never be
   half saved and the working weight always follows what was actually lifted. */
function syncAndSave(e,dr){
  const done=dr.sets.filter(s=>s.reps!==''&&s.reps!=null&&s.reps>0);
  const existing=todayLog(e.id);
  if(!done.length){
    if(existing)D.logs.splice(D.logs.indexOf(existing),1);
  }else{
    const sets=done.map(s=>({reps:+s.reps,w:s.w!=null?s.w:dr.w}));
    if(existing){existing.sets=sets;existing.w=dr.w;existing.ts=Date.now();}
    else D.logs.push({id:uid('g'),exId:e.id,date:today(),ts:Date.now(),w:dr.w,sets:sets});
    e.w=dr.w;
    const m=estMax(e);if(m&&(e.rec==null||m>e.rec))e.rec=Math.round(m*10)/10;
  }
  save();render();
}
function setNote(id,v){const e=exById(id);
  if(v.trim())e.note=v.trim();else delete e.note;save();}
function delLog(lid){
  const i=D.logs.findIndex(l=>l.id===lid);if(i<0)return;
  const snap=D.logs[i];D.logs.splice(i,1);delete DRAFTS[snap.exId];save();render();
  toast('Deleted',()=>{D.logs.splice(Math.min(i,D.logs.length),0,snap);delete DRAFTS[snap.exId];save();render();});
}
function staleDays(exs){
  let best=null;
  exs.forEach(e=>{const l=lastSession(e,true);
    if(l){const d=daysBetween(l.date,today());if(best==null||d<best)best=d;}});
  return best;
}
function setJump(c){JUMP=c;Q='';render();haptic(4);}
function onSearch(v){Q=v;if(v)JUMP='';render();}
function toggleCat(c){D.settings.collapsed[c]=!D.settings.collapsed[c];save();haptic(5);render();}

/* ── the bar you actually use between sets ────────────────────────
   A countdown you set before you start, a stopwatch for anything you want to
   time on the spot, and between them a running count of what has been done —
   so the question "have I done enough legs today" has an answer on screen. */
function todayTally(){
  const byCat={};
  D.logs.filter(l=>l.date===today()).forEach(l=>{
    const e=exById(l.exId);if(!e)return;
    const c=byCat[e.cat]=byCat[e.cat]||{lifts:0,sets:0};
    c.lifts++;c.sets+=(l.sets||[]).length;
  });
  return byCat;
}
function paintWorkoutBar(){
  const el=document.getElementById('wk');
  if(!el)return;
  const on=TAB==='health'&&HSUB==='gym';
  el.classList.toggle('on',on);
  if(!on){clearInterval(TICK);clearInterval(SWTICK);return;}

  const w=D.workout,mins=D.settings.wkMins|0||60;
  const tally=todayTally();
  const cats=Object.keys(tally);
  const tick=cats.length
    ? cats.map(c=>`<span><b>${c.slice(0,4)}</b> ${tally[c].lifts}·${tally[c].sets}</span>`).join('')
    : `<span class="idle">nothing logged today</span>`;

  el.innerHTML=`
    <div class="wkL">
      <button class="wkgo${w?' on':''}${w&&remainMs(w)<0?' over':''}"
        onclick="${w?'stopWorkout()':'startWorkout()'}">
        <span id="wk-t">${w?clockText(remainMs(w)):'START'}</span></button>
      ${w?`<button class="wkx" onclick="cancelWorkout()">✕ cancel</button>`
         :`<span class="wkm"><input type="number" inputmode="numeric" min="1" max="600" value="${mins}"
             aria-label="Workout length in minutes" onchange="setWkMins(this.value)"><i>min</i></span>`}
    </div>
    <div class="wkC">${tick}</div>
    <div class="wkR">
      <button class="wksw${SW.run?' on':''}" onclick="swToggle()">
        <span id="sw-t">${fmtDur(swMs()/1000)}</span></button>
      ${(SW.run||SW.base>0)?`<button class="wkx" onclick="swReset()">↺ reset</button>`:`<span class="wkx idle">stopwatch</span>`}
    </div>`;
  syncTicks();
}
/* Counts down from the length you set, then counts up past it, so running over
   is visible rather than quietly forgotten. Negative means overrun. */
function remainMs(w){
  return (w.mins|0||60)*60000-(Date.now()-w.start);
}
const clockText=ms=>(ms<0?'+':'')+fmtClock(Math.abs(ms));
function setWkMins(v){D.settings.wkMins=clamp(parseInt(v)||60,1,600);save();}
function startWorkout(quiet){
  D.workout={start:Date.now(),mins:D.settings.wkMins|0||60};
  save();
  if(!quiet){haptic([12,30,12]);toast('Started — '+(D.workout.mins)+' minutes');}
  render();
}
function stopWorkout(){
  const w=D.workout;if(!w)return;
  const ms=Date.now()-w.start;
  D.sessions.push({id:uid('s'),date:today(),start:w.start,end:Date.now()});
  D.workout=null;save();render();haptic([14,40,14]);
  toast('Done — '+fmtMins(ms));
}
/* Cancel drops the session. Sets already logged are their own records and stay
   where they are — losing them silently would be its own bug. */
function cancelWorkout(){
  if(!D.workout)return;
  D.workout=null;save();render();haptic(10);
  toast('Timer cancelled — logged sets kept');
}
const swMs=()=>SW.base+(SW.run?Date.now()-SW.t0:0);
function swToggle(){
  if(SW.run){SW.base=swMs();SW.run=false;}
  else{SW.t0=Date.now();SW.run=true;}
  haptic(6);paintWorkoutBar();
}
function swReset(startAgain){
  SW.base=0;
  if(startAgain){SW.t0=Date.now();SW.run=true;}
  else{SW.run=false;haptic(6);}
  paintWorkoutBar();
}
function syncTicks(){
  clearInterval(TICK);clearInterval(SWTICK);
  if(D.workout)TICK=setInterval(()=>{
    const t=document.getElementById('wk-t');
    if(!t||!D.workout){clearInterval(TICK);return;}
    const left=remainMs(D.workout);
    t.textContent=clockText(left);
    if(left<=0&&!D.workout.rang){
      D.workout.rang=true;haptic([25,80,25,80,25]);
      t.parentElement.classList.add('over');
      toast('Time — '+(D.workout.mins)+' minutes done');
    }
  },500);
  if(SW.run)SWTICK=setInterval(()=>{
    const t=document.getElementById('sw-t');
    if(!t){clearInterval(SWTICK);return;}
    t.textContent=fmtDur(swMs()/1000);
  },250);
}

function renderHistory(){
  const m=CALM||new Date();
  const y=m.getFullYear(),mo=m.getMonth();
  const first=new Date(y,mo,1),pad=(first.getDay()+6)%7;
  const days=new Date(y,mo+1,0).getDate();
  const trained=D.logs.filter(l=>ymOf(l.date)===ymOf(ymd(first))).length;

  let cells='';
  for(let i=0;i<pad;i++)cells+=`<div class="cd pad"></div>`;
  for(let d=1;d<=days;d++){
    const ds=ymd(new Date(y,mo,d)),went=trainedOn(ds),isT=ds===today();
    const fut=new Date(y,mo,d)>new Date();
    cells+=`<div class="cd${went?' went':''}${isT?' today':''}${fut?' future':''}">${d}</div>`;
  }
  const all=D.logs.length,sess=D.sessions.length;
  const totalMs=sum(D.sessions,s=>(s.end||0)-(s.start||0));
  const prs=D.exercises.map(e=>({e:e,b:bestEffort(e)})).filter(x=>x.b)
    .sort((a,b)=>b.b.date.localeCompare(a.b.date)).slice(0,8);

  return `<div class="top"><h1>History</h1><div class="meta">${all} LOGS</div></div>
  <div class="cal-nav">
    <button onclick="calMove(-1)" aria-label="Previous month">‹</button>
    <span class="mo">${MONS[mo]} ${y}</span>
    <button onclick="calMove(1)" aria-label="Next month">›</button></div>
  <div class="dow">${['M','T','W','T','F','S','S'].map(d=>`<div>${d}</div>`).join('')}</div>
  <div class="grid7">${cells}</div>
  <div class="strip" style="margin-top:16px">
    <div><div class="n">${trained}</div><div class="l">LOGS THIS MONTH</div></div>
    <div><div class="n">${sess}</div><div class="l">SESSIONS</div></div>
    <div><div class="n">${sess?fmtMins(totalMs/sess):'—'}</div><div class="l">AVERAGE</div></div>
  </div>
  <div class="lab">Recent bests<span class="r">${all} LOGS</span></div>
  ${prs.length?prs.map(x=>`<div class="row"><div class="nm">${esc(x.e.name)}<i>${relDate(x.b.date)}</i></div>
    <span class="v pos">${fmtKg(x.b.w)}kg × ${x.b.reps}</span></div>`).join('')
    :`<div class="row"><div class="nm" style="color:var(--mut)">Nothing logged yet</div></div>`}
  <div class="spacer"></div>`;
}
function calMove(d){
  const m=CALM||new Date();
  CALM=new Date(m.getFullYear(),m.getMonth()+d,1);render();haptic(4);
}

/* ═══════════════════════════════════════════════════════════════
   CAR
   Cost per mile is the headline, not the odometer — it's the number that
   tells you whether a journey was worth it. Insurance, tax and the MOT
   are the same ledger records Money holds; one entry, two pages.
   ═══════════════════════════════════════════════════════════════ */
function renderCar(){
  const f=fuelStats(),f30=fuelLast30();
  const carBills=activeLedger().filter(l=>(l.tags||[]).includes('car'));
  const now=new Date(),dayNow=now.getDate();
  const dates=carBills.map(l=>{
    if(l.cadence==='annual'){
      const due=new Date(now.getFullYear(),(l.month|0)-1,l.day||1);
      if(due<new Date(now.getFullYear(),now.getMonth(),dayNow))due.setFullYear(due.getFullYear()+1);
      return {l:l,in:Math.round((due-new Date(now.getFullYear(),now.getMonth(),dayNow))/86400000),annual:true};
    }
    let dd=l.day-dayNow;
    if(dd<0)dd+=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
    return {l:l,in:dd};
  }).sort((a,b)=>a.in-b.in);

  const open=D.fixes.filter(x=>!x.done),doneFix=D.fixes.filter(x=>x.done);
  const openCost=sum(open,x=>x.cost);

  let h=`<div class="top"><h1>Car</h1><div class="meta">${
    f.odo?f.odo.toLocaleString('en-GB')+' MI':'NO MILEAGE YET'}</div></div>`;

  if(f.legs.length){
    h+=`<div class="hero"><div class="v">${(f.cpm*100).toFixed(1)}<small>p</small></div>
      <div class="u">PER MILE · <b>${f.mpg.toFixed(1)}</b> MPG · <b>${money(f30)}</b> FUEL LAST 30 DAYS</div></div>
    <div class="strip">
      <div><div class="n">${f.miles.toLocaleString('en-GB')}</div><div class="l">MILES TRACKED</div></div>
      <div><div class="n">${money(f.cost)}</div><div class="l">FUEL TRACKED</div></div>
      <div><div class="n">${f.last?f.last.mpg.toFixed(1):'—'}</div><div class="l">LAST TANK MPG</div></div>
    </div>`;
    const budget=+D.settings.fuel||0;
    if(budget&&f30)h+=`<div class="gnote">Your fuel budget is <b>${money(budget)}</b> a month; the last 30 days
      actually cost <b>${money(f30)}</b>. ${f30>budget?'That is <b>'+money(f30-budget)+'</b> over.'
      :'That is <b>'+money(budget-f30)+'</b> under.'}</div>`;
  }else{
    h+=`<div class="hero"><div class="v">—<small>p</small></div>
      <div class="u">PER MILE · LOG TWO FILL-UPS AND THIS STARTS WORKING</div></div>`;
  }

  if(dates.length){
    h+=`<div class="lab">Dates ahead<span class="r">FROM MONEY</span></div>`;
    dates.forEach(x=>{
      h+=`<div class="row tap"><span class="d">${x.annual?MONS[(x.l.month|0)-1].toUpperCase():x.l.day}</span>
        <button class="nm" onclick="editLedger('${x.l.id}')" style="text-align:left">${esc(x.l.name)}
          <i>${x.in===0?'Today':x.in===1?'Tomorrow':'In '+x.in+' days'}${x.annual?' · annual':' · monthly'}</i></button>
        <span class="v">${money(billAmount(x.l))}</span></div>`;
    });
  }

  h+=`<div class="lab">Needs doing<span class="r">${open.length}${openCost?' · '+money(openCost):''}</span>
    <button onclick="editFix(null)">+ ADD</button></div>`;
  if(!open.length&&!doneFix.length)
    h+=`<div class="row"><div class="nm" style="color:var(--mut)">Nothing outstanding</div></div>`;
  open.forEach(x=>{
    h+=`<div class="row"><button class="dot o" onclick="toggleFix('${x.id}')" aria-label="Mark done" style="padding:0"></button>
      <button class="nm" onclick="editFix('${x.id}')" style="text-align:left">${esc(x.name)}
        ${x.due?`<i class="warn">Due ${x.due}</i>`:x.note?'<i>'+esc(x.note)+'</i>':''}</button>
      ${x.cost?`<span class="v">${money(x.cost)}</span>`:''}</div>`;
  });
  if(openCost&&netPosition()<0)
    h+=`<div class="gnote"><b>${money(openCost)}</b> of work is queued up against a month that is already
      <b>${money(netPosition())}</b> short. Worth deciding what waits.</div>`;
  doneFix.slice(0,3).forEach(x=>{
    h+=`<div class="row paid"><span class="dot"></span>
      <button class="nm" onclick="editFix('${x.id}')" style="text-align:left">${esc(x.name)}<i>Done</i></button>
      ${x.cost?`<span class="v mut">${money(x.cost)}</span>`:''}</div>`;
  });

  h+=`<div class="lab">Fuel log<span class="r">${D.fuel.length} FILL-UPS</span>
    <button onclick="editFuel(null)">+ ADD</button></div>`;
  if(!D.fuel.length)
    h+=`<div class="row"><div class="nm" style="color:var(--mut)">No fill-ups yet — two gives you MPG</div></div>`;
  D.fuel.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8).forEach(x=>{
    const leg=f.legs.find(l=>l.date===x.date);
    h+=`<div class="row tap"><span class="d">${x.date.slice(8)}</span>
      <button class="nm" onclick="editFuel('${x.id}')" style="text-align:left">${(+x.litres||0).toFixed(1)}L${
        x.litres&&x.cost?' @ £'+(x.cost/x.litres).toFixed(2):''}
        <i>${(+x.odo||0).toLocaleString('en-GB')} mi${leg?' · '+leg.miles+' mi · '+leg.mpg.toFixed(1)+' mpg':''}</i></button>
      <span class="v">${money(x.cost)}</span></div>`;
  });

  h+=`<div class="lab">Service history<span class="r">${D.service.length}</span>
    <button onclick="editService(null)">+ ADD</button></div>`;
  if(!D.service.length)
    h+=`<div class="row"><div class="nm" style="color:var(--mut)">Nothing logged</div></div>`;
  D.service.slice().sort((a,b)=>b.date.localeCompare(a.date)).forEach(x=>{
    h+=`<div class="row tap"><span class="d">${MONS[+x.date.slice(5,7)-1]}</span>
      <button class="nm" onclick="editService('${x.id}')" style="text-align:left">${esc(x.name)}
        <i>${x.odo?(+x.odo).toLocaleString('en-GB')+' mi':''}${x.note?(x.odo?' · ':'')+esc(x.note):''}</i></button>
      ${x.cost?`<span class="v">${money(x.cost)}</span>`:''}</div>`;
  });
  return h+`<div class="spacer"></div>`;
}
function toggleFix(id){
  const x=D.fixes.find(f=>f.id===id);if(!x)return;
  x.done=!x.done;save();haptic(8);render();
}

/* ═══════════════════════════════════════════════════════════════
   GOALS
   A goal is a name, an optional headline number, and steps. Steps can
   watch real data and tick themselves, and can stay locked until an
   earlier step finishes — which is what makes it a tech tree rather
   than a to-do list you keep in sync by hand.
   ═══════════════════════════════════════════════════════════════ */
const BINDS=[
  {k:'',          label:'I tick it myself'},
  {k:'debtTotal', label:'Total debt',        unit:'£', dir:'lte'},
  {k:'debtOne',   label:'A debt is cleared', ref:'debt'},
  {k:'savings',   label:'Savings balance',   unit:'£', dir:'gte'},
  {k:'wage',      label:'Monthly income',    unit:'£', dir:'gte'},
  {k:'net',       label:'Monthly net',       unit:'£', dir:'gte'},
  {k:'oneRm',     label:'Estimated 1RM',     unit:'kg',dir:'gte', ref:'exercise'},
  {k:'weekDays',  label:'Days trained this week',      dir:'gte'}
];
function bindValue(b,ref){
  switch(b){
    case 'debtTotal': return debtSettle();
    case 'debtOne':   {const d=D.debts.find(x=>x.id===ref);return d?debtCalc(d).settle:null;}
    case 'savings':   return +D.settings.savings||0;
    case 'wage':      return +D.settings.wage||0;
    case 'net':       return netPosition();
    case 'oneRm':     {const e=exById(ref);return e?estMax(e):null;}
    case 'weekDays':  return trainedThisWeek().filter(w=>w.done).length;
  }
  return null;
}
function bindLabel(b,ref,v){
  if(b==='debtOne'){const d=D.debts.find(x=>x.id===ref);
    return v!=null?(v<=0?'CLEARED':money(v)+(d?' LEFT':'')):'—';}
  const def=BINDS.find(x=>x.k===b);
  if(v==null)return '—';
  return def&&def.unit==='£'?money(v):def&&def.unit==='kg'?fmtKg(v)+'kg':String(v);
}
/* A step is done when its number has crossed the line, or when you ticked
   it. Locked steps wait on an earlier one and can't be ticked early. */
function stepState(t,s,seen){
  seen=seen||{};
  let locked=false;
  if(s.after&&!seen[s.id]){                       // guard: two steps can be edited into a loop
    seen[s.id]=1;
    const prev=(t.steps||[]).find(x=>x.id===s.after);
    locked=!!(prev&&!stepState(t,prev,seen).done);
  }
  if(!s.bind)return {done:!!s.done,locked:locked,value:null,label:''};
  const v=bindValue(s.bind,s.ref);
  const target=+s.value||0;
  const dir=s.cmp||(BINDS.find(x=>x.k===s.bind)||{}).dir||'gte';
  const done=v==null?false:(s.bind==='debtOne'?v<=0:(dir==='lte'?v<=target:v>=target));
  return {done:done,locked:locked,value:v,label:bindLabel(s.bind,s.ref,v)};
}
function goalProgress(t){
  if(t.source){
    const s=D.settings;
    if(t.source==='debtTotal'){
      const now=debtSettle(),start=sum(D.debts,d=>+d.total||+d.principal||+d.opening||+d.balance||0);
      return {pct:start?1-now/start:0,label:money(now),
              sub:money(debtService())+'/MO · '+D.debts.filter(d=>!debtCalc(d).done).length+' LEFT'};
    }
    if(t.source==='savings'){const v=+s.savings||0;
      return {pct:t.goal?v/t.goal:0,label:money(v),sub:'OF '+money(t.goal)};}
    if(t.source==='income'){const v=+s.wage||0;
      return {pct:t.goal?v/t.goal:0,label:money(v),sub:'OF '+money(t.goal)+'/MO'};}
  }
  const st=(t.steps||[]).map(s=>stepState(t,s));
  const done=st.filter(x=>x.done).length;
  return {pct:st.length?done/st.length:0,label:done+'/'+st.length,
          sub:st.length?(st.length-done)+' STEPS LEFT':'NO STEPS YET'};
}
function renderGoals(){
  let h=`<div class="top"><h1>Goals</h1>
    <div class="meta"><button onclick="editGoal(null)">+ NEW</button></div></div>`;
  if(!D.targets.length)
    return h+`<div class="empty"><h3>No goals yet</h3>
      <p>One main objective, with steps under it. Steps can watch your real numbers and tick themselves.</p></div>
      <div style="padding:0 16px"><button class="sbtn solid" style="width:100%"
        onclick="editGoal(null)">Add your first goal</button></div><div class="spacer"></div>`;

  TIERS.forEach(tier=>{
    const gs=D.targets.filter(t=>(t.tier||'month')===tier);
    if(!gs.length)return;
    h+=`<div class="lab">${tier==='life'?'Main quest':tier==='year'?'This year':
        tier==='month'?'This month':'This week'}<span class="r">${gs.length}</span></div>`;
    gs.forEach(t=>{
      const p=goalProgress(t);
      h+=`<div class="quest${t.pinned?' pin':''}">
        <div class="qh">
          <button class="nm" onclick="editGoal('${t.id}')" style="text-align:left;flex:1">${esc(t.name)}</button>
          ${t.pinned?'<span class="qt">PINNED</span>':''}
          <span class="pct">${p.label}</span></div>
        <div style="display:flex;align-items:center;gap:9px;margin-bottom:4px">
          <span style="font-size:9.5px;font-weight:800;color:var(--mut);letter-spacing:.3px;width:104px;flex-shrink:0">${p.sub}</span>
          <span class="bar"><i style="width:${pct(p.pct)}"></i></span>
          <span style="font-size:9.5px;font-weight:800;color:var(--mut)">${pct(p.pct)}</span></div>`;
      (t.steps||[]).forEach(s=>{
        const st=stepState(t,s);
        h+=`<div class="step${st.done?' done':''}${st.locked?' lock':''}">
          <button class="bx" onclick="tickStep('${t.id}','${s.id}')"
            aria-label="${st.done?'Untick':'Tick'} ${esc(s.name)}">${st.done?'✓':''}</button>
          <span class="sn">${esc(s.name)}</span>
          <span class="sv${st.done?' pos':''}">${st.locked?'LOCKED':(s.bind?st.label:'')}</span>
          <button class="rm" onclick="delStep('${t.id}','${s.id}')" aria-label="Remove step">✕</button></div>`;
      });
      h+=`<button class="addset" onclick="editStep('${t.id}',null)">+ ADD A STEP</button></div>`;
    });
  });
  return h+`<div class="spacer"></div>`;
}
/* A bound step can't be ticked by hand — its number decides. Saying so is
   better than letting a tap do nothing. */
function tickStep(gid,sid){
  const t=D.targets.find(x=>x.id===gid);if(!t)return;
  const s=(t.steps||[]).find(x=>x.id===sid);if(!s)return;
  const st=stepState(t,s);
  if(st.locked){toast('Finish the step before it first');return;}
  if(s.bind){toast('This one ticks itself — '+st.label);return;}
  s.done=!s.done;save();haptic(8);render();
}
function delStep(gid,sid){
  const t=D.targets.find(x=>x.id===gid);if(!t)return;
  const i=(t.steps||[]).findIndex(x=>x.id===sid);if(i<0)return;
  const snap=t.steps[i];t.steps.splice(i,1);save();render();
  toast('Removed',()=>{t.steps.splice(Math.min(i,t.steps.length),0,snap);save();render();});
}

/* ═══════════════════════════════════════════════════════════════
   SHEETS
   One declarative form drives every editor in the app. Adding a field to
   anything is a line in a list rather than another hand-built form, which
   is what keeps "add your own data points" achievable.
   ═══════════════════════════════════════════════════════════════ */
let SHEET=null, FORM=null;

function openSheet(html){
  /* Repainting a form replaces the sheet; it does not close it. Tearing down
     through closeSheet here would clear FORM mid-edit, so every segmented
     control, tag or solver button would break on its second tap. */
  if(SHEET){SHEET.remove();SHEET=null;}
  const bg=document.createElement('div');
  bg.className='sheet-bg';
  bg.innerHTML='<div class="sheet"><div class="sheet-grab"></div>'
    +'<button class="sheet-x" onclick="closeSheet()" aria-label="Close">✕</button>'
    +html+'</div>';
  bg.addEventListener('click',e=>{if(e.target===bg)closeSheet();});
  document.body.appendChild(bg);SHEET=bg;
  requestAnimationFrame(()=>bg.classList.add('on'));
}
function closeSheet(now){
  if(!SHEET){FORM=null;return;}
  const s=SHEET;SHEET=null;FORM=null;
  s.classList.remove('on');
  if(now)s.remove();else setTimeout(()=>s.remove(),260);
}

function fieldHtml(f,v){
  const id='f-'+f.k;
  const lab=`<label for="${id}">${f.label}</label>`;
  if(f.type==='seg')
    return `<div class="ef"><label>${f.label}</label><div class="eseg">${f.opts.map(o=>
      `<button class="${String(v)===String(o.k)?'on':''}" onclick="setField('${f.k}','${o.k}')">${o.label}</button>`
      ).join('')}</div></div>`;
  if(f.type==='tags')
    return `<div class="ef"><label>${f.label}</label><div class="tagrow">${TAGS.map(t=>
      `<button class="${(v||[]).includes(t)?'on':''}" onclick="toggleField('${f.k}','${t}')">${t}</button>`
      ).join('')}</div></div>`;
  if(f.type==='select')
    return `<div class="ef">${lab}<select id="${id}">${f.opts.map(o=>
      `<option value="${esc(o.k)}"${String(v)===String(o.k)?' selected':''}>${esc(o.label)}</option>`
      ).join('')}</select></div>`;
  if(f.type==='textarea')
    return `<div class="ef">${lab}<textarea id="${id}" placeholder="${esc(f.ph||'')}">${esc(v||'')}</textarea></div>`;
  const t=f.type==='number'?'number':f.type==='date'?'date':'text';
  const im=f.type==='number'?(f.int?'numeric':'decimal'):'';
  return `<div class="ef">${lab}<input id="${id}" type="${t}"${im?' inputmode="'+im+'"':''}
    value="${esc(v==null?'':v)}" placeholder="${esc(f.ph||'')}"${f.step?' step="'+f.step+'"':''}>
    ${f.note?`<div class="note">${typeof f.note==='function'?f.note(FORM.value):f.note}</div>`:''}</div>`;
}
function paintForm(){
  const f=FORM;
  const rows=[];
  let i=0;
  while(i<f.fields.length){
    const cur=f.fields[i];
    if(cur.hide&&cur.hide(f.value)){i++;continue;}
    if(cur.half){
      const grp=[];
      while(i<f.fields.length&&f.fields[i].half&&!(f.fields[i].hide&&f.fields[i].hide(f.value))){
        grp.push(f.fields[i]);i++;
        if(grp.length===(cur.of||2))break;
      }
      rows.push(`<div class="efr">${grp.map(x=>fieldHtml(x,f.value[x.k])).join('')}</div>`);
    }else{rows.push(fieldHtml(cur,f.value[cur.k]));i++;}
  }
  openSheet(`<h2>${esc(f.title)}</h2>${f.sub?`<div class="sub">${f.sub}</div>`:''}
    ${rows.join('')}
    ${f.extra?f.extra(f.value):''}
    <div class="srow"><button class="sbtn solid" onclick="submitForm()">Save</button>
      ${f.del?`<button class="sbtn danger" onclick="deleteForm()">Delete</button>`
             :`<button class="sbtn" onclick="closeSheet()">Cancel</button>`}</div>`);
}
function grabForm(){
  if(!FORM)return;
  FORM.fields.forEach(f=>{
    if(f.type==='seg'||f.type==='tags')return;
    const el=document.getElementById('f-'+f.k);
    if(!el)return;
    FORM.value[f.k]=f.type==='number'?(el.value===''?null:parseFloat(el.value)):el.value;
  });
}
function setField(k,v){grabForm();FORM.value[k]=v;paintForm();}
function toggleField(k,v){
  grabForm();
  const a=FORM.value[k]=FORM.value[k]||[];
  const i=a.indexOf(v);if(i<0)a.push(v);else a.splice(i,1);
  paintForm();
}
function submitForm(){
  grabForm();
  const r=FORM.save(FORM.value);
  if(r===false)return;
  save();closeSheet();render();haptic(8);toast('Saved');
}
function deleteForm(){
  const f=FORM;grabForm();
  const undo=f.del(f.value);
  save();closeSheet();render();
  toast('Deleted',undo||undefined);
}
function form(o){FORM=o;paintForm();}
/* Remove one item from a list and hand back an undo that puts it where it was. */
function pull(list,id){
  const i=list.findIndex(x=>x.id===id);
  if(i<0)return null;
  const snap=list[i];list.splice(i,1);
  return ()=>{list.splice(Math.min(i,list.length),0,snap);save();render();};
}

   out since — and how long ago that was. A number nobody has checked in months

function balanceNote(v){
  if(v.kind!=='revolving')return '';
  if(!v.balanceAt)return 'Straight off your latest statement. A credit line has no term — how long it takes depends on what you pay.';
  const n=cyclesBetween(v.balanceAt,today());
  if(!n)return `Read on <b>${v.balanceAt}</b>. Nothing assumed since.`;
  return `Read on <b>${v.balanceAt}</b>, then carried forward <b>${n}</b> payment${n>1?'s':''}
    at the minimum — now <b>${money(rollBalance(v,n),true)}</b>. Type today's figure to reset it.`;
}

/* The part that answers "what do I actually owe". Three solvers, because
   you rarely have all four of borrowed / payment / term / rate — and the
   one nobody ever tells you is the rate. */
function debtExtra(v){
  const c=debtCalc(v);
  if(v.kind==='revolving')return revolvingExtra(v,c);
  let h=`<div class="brk"><div class="bh">Where it stands</div>
    <div class="kv"><span class="k">Payments made</span><span class="v">${c.paid} of ${c.months}</span></div>
    <div class="kv"><span class="k">Counted from</span><span class="v">${v.paidAnchor&&v.paidAnchor.date
      ?'your payment on '+v.paidAnchor.date
      :'the first payment, '+ymd(firstPayment(v))}</span></div>
    <div class="kv"><span class="k">Pay it out as agreed</span><span class="v">${money(c.paymentsLeft)}</span></div>`;
  if(c.ratedKnown){
    h+=`<div class="kv"><span class="k">Clear it today</span><span class="v pos">${money(c.settle)}</span></div>
      <div class="kv"><span class="k">Interest you'd skip</span><span class="v crit">${money(c.interestLeft)}</span></div>
      <div class="kv"><span class="k">Interest over the whole thing</span><span class="v">${money(c.interestTotal)}</span></div>`;
  }else{
    h+=`<div class="kv"><span class="k">Clear it today</span><span class="v">Needs a rate</span></div>`;
  }
  h+=`<div class="kv"><span class="k">Last payment</span><span class="v">${c.endLabel}</span></div>
    <div class="kv"><span class="k">Frees up</span><span class="v pos">${money(+v.monthly||0)}/mo from ${c.freeLabel}</span></div>
    <div class="srow" style="margin-top:12px"><button class="sbtn" onclick="payDebt('${v.id}')">Record a payment</button></div>`;

  if(v.kind==='apr'){
    const implied=solveApr(v.principal,v.monthly,v.months,v.balloon);
    h+=`<div class="brk"><div class="bh">Work out the missing one</div>
      <div class="note" style="font-size:10.5px;color:var(--mut);font-weight:600;line-height:1.5;margin-bottom:11px">
        Fill in any three and solve for the fourth. If you know what you borrowed and what you pay,
        <b>Find the rate</b> gives you the APR nobody put in writing${
          implied!=null?` — currently <b>${implied.toFixed(1)}%</b>`:''}.</div>
      <div class="srow"><button class="sbtn" onclick="solveField('apr')">Find the rate</button>
        <button class="sbtn" onclick="solveField('monthly')">Find the payment</button></div>
      <div class="srow"><button class="sbtn" onclick="solveField('principal')">Find what you borrowed</button></div></div>`;
  }else{
    const t=+v.total||0,pay=+v.monthly||0,n=v.months|0;
    h+=`<div class="brk"><div class="bh">Turn this into a real balance</div>
      <div class="note" style="font-size:10.5px;color:var(--mut);font-weight:600;line-height:1.5;margin-bottom:11px">
        ${n&&pay?`${n} × ${money(pay)} is <b>${money(n*pay)}</b>${
          t&&Math.abs(t-n*pay)>1?` — your total says ${money(t)}, so about <b>${money(Math.abs(t-n*pay))}</b>
          of that is a fee or a final payment`:''}. `:''}
        Switch to <b>Amount + rate</b> and put in what actually landed in your account. The app works the
        rest out, and "clear it today" starts telling you the truth.</div>
      <div class="srow"><button class="sbtn" onclick="convertToApr()">Switch to amount + rate</button></div></div>`;
  }
  return h+`</div>`;
}
/* The question a credit line actually raises is not "how much is left" but
   "how much of what I pay is doing anything". Everything here answers that. */
function revolvingExtra(v,c){
  const pay=c.payment||0, off=Math.max(0,pay-(+v.spend||0)-c.interestNow);
  const bite=pay?c.interestNow/pay:0;
  let h=`<div class="brk"><div class="bh">Where it stands</div>
    <div class="kv"><span class="k">Balance${c.cycles?' (worked out)':''}</span>
      <span class="v">${money(c.settle,true)}</span></div>
    ${c.cycles?`<div class="kv"><span class="k">Last read from a statement</span>
      <span class="v${c.cycles>=3?' crit':''}">${c.balanceFrom} · ${money(c.stored,true)}</span></div>`:''}
    <div class="kv"><span class="k">Interest on this balance</span><span class="v crit">${money(c.interestNow,true)}</span></div>
    <div class="kv"><span class="k">Of your ${money(c.payment)} payment${c.usingMin?' (the minimum)':''}</span>
      <span class="v${bite>0.4?' crit':''}">${money(c.interestNow)} is interest</span></div>
    <div class="kv"><span class="k">Actually comes off the balance</span>
      <span class="v${off<=0?' crit':' pos'}">${money(off)}</span></div>`;
  if(c.stalled){
    h+=`<div class="kv"><span class="k">Time to clear</span><span class="v crit">Never</span></div>
      <div class="note" style="font-size:10.5px;color:var(--crit);font-weight:700;line-height:1.5;margin-top:9px">
        What you pay does not cover the interest and the new spending, so this balance grows. Pay more than
        <b>${money(c.interestNow+(+v.spend||0),true)}</b> a month or it never ends.</div>`;
  }else{
    h+=`<div class="kv"><span class="k">Clear in</span>
        <span class="v">${c.left} months · ${c.freeLabel}</span></div>
      <div class="kv"><span class="k">Interest before it's gone</span>
        <span class="v crit">${money(c.interestLeft)}</span></div>
      <div class="kv"><span class="k">Total you'll hand over</span>
        <span class="v">${money(c.paymentsLeft)}</span></div>`;
  }
  /* The same money, held flat instead of shrinking, is the comparison that
     actually changes what someone does. Show it whenever a minimum applies. */
  if(+v.minPct>0){
    const r0=monthlyRate(v.apr),B0=c.settle,sp=+v.spend||0;
    const flat=runDown(B0,r0,c.minPay,sp,2400);
    const inFive=(()=>{let b=B0;for(let k=0;k<60&&b>5;k++){b=b*(1-(+v.minPct)/100);}return b*(r0+(+v.minPct)/100);})();
    h+=`<div class="brk"><div class="bh">${c.usingMin?'What the minimum is doing':'If you only paid the minimum'}</div>
      <div class="kv"><span class="k">Minimum right now</span><span class="v">${money(c.minPay,true)}</span></div>
      <div class="kv"><span class="k">The same amount, held flat</span>
        <span class="v pos">${isFinite(flat.months)?flat.months+' months':'never'}</span></div>
      ${c.usingMin?`<div class="kv"><span class="k">Paying the minimum instead</span>
        <span class="v crit">${isFinite(c.left)?c.left+' months · '+(c.left/12).toFixed(0)+' years':'never'}</span></div>
      <div class="kv"><span class="k">What that costs you</span>
        <span class="v crit">${isFinite(c.interestLeft)&&isFinite(flat.interest)
          ?money(c.interestLeft-flat.interest)+' more interest':'—'}</span></div>`:''}
      <div class="kv"><span class="k">Minimum in five years</span><span class="v">${money(inFive,true)}</span></div>
      <div class="note" style="font-size:10.5px;color:var(--mut);font-weight:600;line-height:1.5;margin-top:9px">
        The minimum is a flat <b>${(monthlyRate(v.apr)*100+ +v.minPct).toFixed(2)}%</b> of the balance — the
        interest plus ${v.minPct}% of capital — so it only ever clears ${v.minPct}% a month, and it shrinks
        as the balance does. <b>Standing order the same money instead</b> and it stops moving away from you.</div></div>`;
  }
  const r=monthlyRate(v.apr), B=c.settle, sp=+v.spend||0;
  const bill=D.ledger.find(x=>x.debtId===v.id&&x.active!==false);
  if(bill&&Math.abs((+bill.amount||0)-pay)>1){
    const diff=(+bill.amount||0)-pay;
    h+=`<div class="brk"><div class="bh">Your bills say something different</div>
      <div class="kv"><span class="k">Budgeted on Money</span><span class="v">${money(bill.amount)}</span></div>
      <div class="kv"><span class="k">Actually leaving your account</span><span class="v">${money(pay,true)}</span></div>
      <div class="note" style="font-size:10.5px;color:var(--mut);font-weight:600;line-height:1.5;margin-top:9px">
        ${diff>0?`You budget <b>${money(diff,true)}</b> a month more than you pay. Paying the budgeted
          <b>${money(bill.amount)}</b> as a standing order would clear this in
          <b>${runDown(B,r,+bill.amount||0,sp,2400).months} months</b>.`
         :`You pay <b>${money(-diff,true)}</b> a month more than the bill allows for, so your real
          outgoings are higher than Money shows.`}</div></div>`;
  }
  const sched=minSchedule(v,12);
  if(sched.length){
    h+=`<div class="brk"><div class="bh">The next twelve payments</div>`;
    sched.slice(0,4).forEach(x=>{
      h+=`<div class="kv"><span class="k">${x.label}</span>
        <span class="v">${money(x.due,true)}<span style="color:var(--mut);font-weight:600">
        · leaves ${money(x.after)}</span></span></div>`;
    });
    h+=`<div class="kv"><span class="k">Twelve months of payments</span>
        <span class="v">${money(sum(sched,x=>x.due))}</span></div>
      <div class="srow"><button class="sbtn" onclick="scheduleSheet('${v.id}')">See every future payment</button></div>
      <div class="srow"><button class="sbtn solid" onclick="payDebt('${v.id}')">Record a payment</button></div></div>`;
  }
  if((v.history||[]).length){
    h+=`<div class="brk"><div class="bh">What you've actually paid</div>`;
    v.history.slice().reverse().slice(0,6).forEach(x=>{
      h+=`<div class="kv"><span class="k">${x.date}</span>
        <span class="v">${money(x.amount,true)}${x.purchases?' · spent '+money(x.purchases,true):''}</span></div>`;
    });
    h+=`</div>`;
  }
  h+=`<div class="brk"><div class="bh">What paying more would do</div>`;
  const base=c.payment||pay;
  [base,base+50,base+100,base+150].forEach((p,idx)=>{
    if(idx===0&&!c.usingMin)return;                 // already the headline above
    const net=p-sp-B*r;
    if(net<=0)return;
    const n=Math.ceil(-Math.log(1-r*B/(p-sp))/Math.log(1+r));
    const int=Math.max(0,n*p-B-n*sp);
    const saved=c.stalled?null:c.interestLeft-int;
    h+=`<div class="kv"><span class="k">${money(p)} a month</span>
      <span class="v">${n} months${saved!=null&&saved>0&&isFinite(saved)?' · saves '+money(saved):''}</span></div>`;
  });
  return h+`</div>`;
}

/* Every future payment, laid out. The point of this page is that a minimum
   payment is only unpredictable if nobody works it out — the rate and the
   balance already determine the whole schedule. */
function scheduleSheet(id){
  const d=D.debts.find(x=>x.id===id);if(!d)return;
  const rows=minSchedule(d,60);
  const yr=rows.slice(0,12),next=rows[0];

    <div class="sub">${d.payMin
      ?`Each payment is <b>${((monthlyRate(d.apr)+(+d.minPct||0)/100)*100).toFixed(2)}%</b> of that month's
        statement, so it falls as the balance does. Nothing here is a guess — it follows from the rate and
        the balance you have now.`
      :`At <b>${money(+d.monthly||0)}</b> a month.`}</div>
    ${next?`<div class="kv"><span class="k">Next payment</span>
      <span class="v">${money(next.due,true)} · ${next.label}</span></div>
    <div class="kv"><span class="k">Next twelve months</span>
      <span class="v">${money(sum(yr,r=>r.due))}</span></div>
    <div class="kv"><span class="k">Interest inside that</span>
      <span class="v crit">${money(sum(yr,r=>r.interest))}</span></div>
    <div class="kv"><span class="k">Balance in a year</span>
      <span class="v">${money(yr[yr.length-1].after)}</span></div>`:''}
    <div class="gwrap" style="margin-top:14px;max-height:44vh;overflow-y:auto">
      <table class="g"><thead><tr>
        <th>Due</th><th style="text-align:right">Payment</th>
        <th style="text-align:right">Interest</th><th style="text-align:right">Balance after</th>
      </tr></thead><tbody>
      ${rows.map(r=>`<tr>
        <td style="padding:7px 8px;font-size:13px;font-weight:700">${r.label}</td>
        <td style="padding:7px 8px;font-size:13px;font-weight:700;text-align:right">${money(r.due,true)}</td>
        <td style="padding:7px 8px;font-size:12px;text-align:right;color:var(--crit)">${money(r.interest,true)}</td>
        <td style="padding:7px 8px;font-size:13px;text-align:right">${money(r.after)}</td></tr>`).join('')}
      </tbody></table></div>
    ${rows.length>=60?`<div class="gnote">Showing five years. At this rate it runs a good deal longer.</div>`:''}
    <div class="srow"><button class="sbtn solid" onclick="editDebt('${d.id}')">Back</button></div>`);
}

/* Record what actually left the account. Pay more than the minimum and every
   number downstream — the balance, the term, the interest, next month's
   minimum — moves on its own. */
function payDebt(id){
  const d=D.debts.find(x=>x.id===id);if(!d)return;
  if(d.kind!=='revolving')return payTermDebt(d);
  const next=minSchedule(d,1)[0];
  form({
    title:'Record a payment',
    sub:next?`The minimum due next is <b>${money(next.due,true)}</b>. Anything above it comes straight off
      the balance, and next month's minimum drops with it.`:'',
    value:{id:d.id,amount:next?Math.round(next.due*100)/100:null,purchases:null,date:today()},
    fields:[
      {k:'amount',label:'You paid £',type:'number',step:'0.01',half:true},
      {k:'date',label:'Date',type:'date',half:true},
      {k:'purchases',label:'Anything new put on it £',type:'number',step:'0.01',
       note:'Spending on a credit line is charged at the same rate, so it costs more than it looks.'}
    ],
    save:v=>{
      const amt=+v.amount||0,buy=+v.purchases||0,when=v.date||today();
      if(amt<=0&&buy<=0){toast('Nothing to record');return false;}
      /* The projection already assumes a payment each cycle. If this one lands
         in a later cycle it replaces that assumption, so roll to the cycle
         before it and apply this statement's interest. A second payment inside
         the same cycle is extra money, and carries no new interest. */
      const n=d.balanceAt?cyclesBetween(d.balanceAt,when):0;
      let bal=rollBalance(d,Math.max(0,n-1));
      if(n>=1)bal=bal+bal*monthlyRate(d.apr)+(+d.spend||0);
      d.balance=Math.max(0,bal-amt+buy);
      d.balanceAt=when;
      if(amt>0)d.lastPaid=amt;
      d.history=(d.history||[]).concat([{date:when,amount:amt,purchases:buy,
                                         balance:d.balance}]).slice(-36);
    }
  });
}

/* On a fixed-term agreement the useful thing to record is that a payment
   happened, because it pins the count instead of leaving it to arithmetic
   about start dates. Overpayments are the lender's business — they shorten
   the term, but by rules only they can tell you, so say so rather than
   inventing a figure. */
function payTermDebt(d){
  const c=debtCalc(d);
  form({
    title:'Record a payment',
    sub:`<b>${c.paid} of ${c.months}</b> paid so far. Recording one pins that count to a date, so it
      stops depending on assumptions about when the agreement started.`,
    value:{amount:+d.monthly||0,date:today()},
    fields:[
      {k:'amount',label:'You paid £',type:'number',step:'0.01',half:true},
      {k:'date',label:'Date',type:'date',half:true}
    ],
    save:v=>{
      const amt=+v.amount||0,when=v.date||today();
      if(amt<=0){toast('Nothing to record');return false;}
      d.paidAnchor={date:when,count:clamp(c.paid+1,0,d.months|0)};
      d.history=(d.history||[]).concat([{date:when,amount:amt,purchases:0,
                                         balance:null}]).slice(-36);
      if(amt>(+d.monthly||0)+0.5)
        toast('Logged — an overpayment usually shortens the term, so check the new figure');
    }
  });
}

function solveField(which){
  grabForm();
  const v=FORM.value;
  if(which==='apr'){
    const r=solveApr(v.principal,v.monthly,v.months,v.balloon);
    if(r==null){toast('Needs the amount, the payment and the term');return;}
    v.apr=Math.round(r*100)/100;
    toast('Rate ≈ '+v.apr.toFixed(2)+'% APR');
  }else if(which==='monthly'){
    const p=solvePayment(+v.principal||0,+v.apr||0,v.months,v.balloon);
    if(p==null||!isFinite(p)){toast('Needs the amount, the rate and the term');return;}
    v.monthly=Math.round(p*100)/100;
    toast('Payment ≈ '+money(v.monthly,true));
  }else{
    const p=solvePrincipal(v.monthly,+v.apr||0,v.months,v.balloon);
    if(!isFinite(p)){toast('Needs the payment, the rate and the term');return;}
    v.principal=Math.round(p*100)/100;
    toast('Borrowed ≈ '+money(v.principal,true));
  }
  haptic(10);paintForm();
}
/* Carry the schedule over as a starting point: the total is not the
   principal, but the payment and the term are right, so only one number
   is left to find. */
function convertToApr(){
  grabForm();
  const v=FORM.value;
  v.kind='apr';
  if(v.principal==null&&v.total)v.principal=+v.total;
  paintForm();
  toast('Now enter what actually landed in your account');
}

      <tbody>${rows.map((r,i)=>`<tr>${g.cols.map(c=>`<td>${

          `<option${String(r[c.k])===o?' selected':''}>${o}</option>`).join('')}</select>`

      </tbody></table></div>

function gridSet(i,k,v){
  const g=GRIDS[GRIDK],r=g.list()[i];if(!r)return;
  const col=g.cols.find(c=>c.k===k);
  r[k]=col&&col.n?(parseFloat(v)||0):v;

}
function gridAdd(){GRIDS[GRIDK].list().push(GRIDS[GRIDK].make());save();paintGrid();}
function gridDel(i){
  const list=GRIDS[GRIDK].list(),snap=list[i];
  list.splice(i,1);save();paintGrid();
  toast('Deleted '+(snap.name||'row'),()=>{list.splice(Math.min(i,list.length),0,snap);save();paintGrid();});

function pasteSheet(){
  const g=GRIDS[GRIDK];
  openSheet(`<h2>Paste from a spreadsheet</h2>
    <div class="sub">Copy the cells and paste them here. Columns are read in this order:
      <b>${g.cols.map(c=>c.t).join(' · ')}</b>. A header row is skipped automatically.</div>
    <div class="ef"><textarea id="pastebox" style="min-height:150px;font-size:14px"
      placeholder="Broadband	32	1&#10;Phone	24	15"></textarea></div>
    <div class="srow"><button class="sbtn solid" onclick="doPaste()">Add these rows</button>
      <button class="sbtn" onclick="paintGrid()">Back</button></div>`);
}
/* Excel and Numbers both put a tab between cells and a newline between rows.
   Strip currency symbols and thousands separators so a copied £1,056.00
   arrives as a number rather than zero. */
function doPaste(){
  const g=GRIDS[GRIDK],txt=document.getElementById('pastebox').value||'';
  const lines=txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  let added=0;
  lines.forEach((line,i)=>{
    const cells=line.split('\t').map(c=>c.trim());
    if(i===0&&cells.every(c=>isNaN(parseFloat(c.replace(/[£$,]/g,'')))) &&
       cells.some(c=>g.cols.some(col=>col.t.toLowerCase()===c.toLowerCase())))return;   // header
    const row=g.make();
    g.cols.forEach((c,j)=>{
      if(cells[j]==null||cells[j]==='')return;
      row[c.k]=c.n?(parseFloat(String(cells[j]).replace(/[£$,\s]/g,''))||0):cells[j];
    });
    g.list().push(row);added++;
  });
  save();
  if(added){haptic(10);toast('Added '+added+' row'+(added>1?'s':''));}
  else toast('Nothing to add');
  paintGrid();
}

/* ═══ chrome ══════════════════════════════════════════════════
   position:fixed pins to the layout viewport, so pinching magnifies the top
   bar and the tab bar along with everything else and shoves them off screen.
   These two are furniture: hold them against the visual viewport at a
   constant size, whatever the zoom. */
function pinChrome(){
  const v=window.visualViewport;if(!v)return;
  const z=v.scale||1,inv=1/z;
  [['bar',0],['nav',1]].forEach(([id,atBottom])=>{
    const el=document.getElementById(id);if(!el)return;
    const h=el.offsetHeight;
    const y=atBottom ? v.offsetTop+v.height-h*inv : v.offsetTop;
    el.style.transformOrigin='0 0';
    el.style.transform='translate('+v.offsetLeft+'px,'+y+'px) scale('+inv+')';
  });
}
if(window.visualViewport){
  ['resize','scroll'].forEach(ev=>window.visualViewport.addEventListener(ev,pinChrome));
  window.addEventListener('orientationchange',()=>setTimeout(pinChrome,200));
}

/* Tapping a figure should let you type over it, not make you clear it first. */
document.addEventListener('focusin',e=>{
  const t=e.target;
  if(t&&t.matches&&t.matches('input[type=number],input.selall'))
    setTimeout(()=>{try{t.select();}catch(_){}} ,0);
});

/* ═══ boot ════════════════════════════════════════════════════ */
load();render();pinChrome();
window.addEventListener('pageshow',()=>{if(TAB==='home')render();});
if('serviceWorker' in navigator)
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

</script>
</body>
</html>
