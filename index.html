<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=6,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>BASE</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* ═══════════════════════════════════════════════════════════════
   Tokens. Monochrome by design — the only two hues in the app are
   --pos and --crit, and they only ever encode state, never identity.
   Emphasis is an inverted black fill, not a colour.
   ═══════════════════════════════════════════════════════════════ */
:root{
  --bg:#fff; --ink:#0a0a0a; --mut:#8b8b90; --dim:#bcbcc2;
  --line:#ededf0; --line2:#dcdce1; --hl:#f7f7f8;
  --pos:#12693a; --crit:#9b3a31;
  --scrim:rgba(0,0,0,.5); --sheet:#ffffff;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#000; --ink:#f2f2f4; --mut:#8b8b90; --dim:#4a4a50;
        --line:#1e1e21; --line2:#2e2e33; --hl:#131316;
        --pos:#4ad07d; --crit:#d97b70;
        /* Darkening black achieves nothing, so the page is veiled instead and
           the sheet becomes a lifted surface above it. */
        --scrim:rgba(150,150,165,.20); --sheet:#16161a;}
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;-webkit-text-size-adjust:100%}
body{height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',Arial,sans-serif;
  font-size:15px;line-height:1.3;overflow:hidden;font-variant-numeric:tabular-nums}
#bar{position:fixed;top:0;left:0;right:0;z-index:35;background:var(--bg);
  border-bottom:1px solid var(--line);padding:calc(var(--safe-t) + 9px) 16px 9px;
  display:flex;align-items:center;gap:10px}
#bar #bar-d{font-size:10px;font-weight:800;letter-spacing:1.3px;color:var(--mut)}
#bar button{margin-left:auto;font-size:9px;font-weight:800;letter-spacing:1px;color:var(--ink);
  border:1px solid var(--line2);border-radius:13px;height:26px;padding:0 12px;flex-shrink:0}
#bar button:active{background:var(--hl)}
#app{position:fixed;top:calc(var(--safe-t) + 39px);left:0;right:0;
  bottom:calc(50px + var(--safe-b));overflow-y:auto;-webkit-overflow-scrolling:touch}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;touch-action:manipulation}
input,select,textarea{font-family:inherit;font-size:16px;color:inherit;background:var(--bg);border:none}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}

/* ── page chrome ───────────────────────────────────────────── */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  padding:14px 16px 11px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.top h1{font-size:19px;font-weight:800;letter-spacing:-.5px}
.top .meta{font-size:11px;font-weight:800;color:var(--mut);letter-spacing:.4px;flex-shrink:0}
.top .meta button{font-size:11px;font-weight:800;letter-spacing:.4px;color:var(--ink)}
.top .meta button.on{color:var(--crit)}

/* Big thin numeral against tiny fat label — the whole personality. */
.hero{padding:20px 16px 18px}
.hero .v{font-size:52px;font-weight:300;letter-spacing:-3px;line-height:1}
.hero .v.neg{color:var(--crit)}
.hero .v small{font-size:26px;font-weight:400;letter-spacing:-1px;color:var(--mut)}
.hero .u{font-size:11px;font-weight:700;color:var(--mut);margin-top:9px;letter-spacing:.2px;line-height:1.5}
.hero .u b{color:var(--ink);font-weight:800}

/* Structure carries the hierarchy, since the palette will not. A section
   starts with real space above it, a rule across the full width, and a label
   in ink rather than grey — so the eye finds the boundary before it reads. */
.lab{font-size:10px;font-weight:800;letter-spacing:1.4px;color:var(--ink);
  padding:32px 16px 10px;text-transform:uppercase;display:flex;align-items:baseline;gap:8px;
  border-top:1px solid var(--line2);margin-top:14px}
.lab.first{border-top:none;margin-top:0;padding-top:22px}
/* Bills, food and fuel, other payments and the totals are one statement read
   top to bottom, so they get subheadings rather than section breaks — the same
   hairline the rows use, and a fraction of the space. The hard rules are saved
   for the reference sections underneath, which really are separate. */
.lab.tight{padding:17px 16px 7px;margin-top:0;border-top:1px solid var(--line)}
.lab.foldable.tight{padding-top:15px;padding-bottom:13px}
.lab .r{margin-left:auto;font-weight:800;color:var(--dim);letter-spacing:.6px;font-size:9px}
.lab button{font-size:9px;font-weight:800;letter-spacing:.8px;color:var(--ink);
  border-bottom:1px solid var(--line2);padding-bottom:1px}
.lab button.on{color:var(--crit);border-color:var(--crit)}
.lab.foldable{width:100%;text-align:left;padding-top:30px;padding-bottom:16px;
  align-items:center;gap:8px}
.lab.foldable:active{background:var(--hl)}
.lab.foldable .r{margin-left:auto}
.fchev{width:10px;height:10px;stroke:var(--dim);fill:none;stroke-width:3;stroke-linecap:round;
  stroke-linejoin:round;flex-shrink:0;transition:transform .16s}
.fchev.on{transform:rotate(90deg)}

/* the two lines nobody has receipts for */
.vrow{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line);
  width:100%;text-align:left}
.vrow:active{background:var(--hl)}
.vrow .vn{flex:1;min-width:0;font-size:14px;font-weight:600;letter-spacing:-.2px}
.vrow .vn i{display:block;font-style:normal;font-size:10px;font-weight:600;color:var(--mut);margin-top:2px}
.vrow .vv{text-align:right;flex-shrink:0}
.vrow .vv .b{display:block;font-size:15px;font-weight:800;letter-spacing:-.3px}
.vrow .vv .s{display:block;font-size:10px;font-weight:700;color:var(--mut);margin-top:2px}
.vrow .vv .s.crit{color:var(--crit)}
.vrow .arrow{font-size:16px;color:var(--dim);font-weight:800;flex-shrink:0}

/* the number he is trying to move */
.total{padding:0 16px}
.total .tr{display:flex;align-items:baseline;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.total .tr:first-child{border-top:none}
.total .tr span{flex:1;color:var(--mut);font-weight:600}
.total .tr b{font-weight:700;letter-spacing:-.3px}
.total .tr.sum{border-top:1px solid var(--line2);font-size:16px;padding:12px 0}
.total .tr.sum span,.total .tr.sum b{color:var(--ink);font-weight:800}
.total .tr.net{border-top:1px solid var(--ink);margin-bottom:6px}
.total .tr b.neg{color:var(--crit)} .total .tr b.pos{color:var(--pos)}

/* ── rows. No cards anywhere: hairlines and air only. ──────── */
.row{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line);
  width:100%;text-align:left}
.row:first-of-type{border-top:none}
.row.tap:active{background:var(--hl)}
.row .nm{flex:1;min-width:0;font-size:14px;font-weight:600;letter-spacing:-.2px}
.row .nm i{display:block;font-style:normal;font-size:10.5px;font-weight:600;color:var(--mut);
  margin-top:2px;line-height:1.4}
.row .nm i.warn{color:var(--crit);font-weight:700}
.row .nm i.good{color:var(--pos);font-weight:700}
.row .d{font-size:10px;font-weight:800;color:var(--dim);width:26px;flex-shrink:0;letter-spacing:.3px}
.row .v{font-size:14px;font-weight:700;letter-spacing:-.3px;flex-shrink:0}
.row .v.mut{color:var(--dim);font-weight:600}
.row .v.pos{color:var(--pos)}
.row .v.crit{color:var(--crit)}
.row .dot{width:6px;height:6px;border-radius:50%;background:var(--ink);flex-shrink:0}
.row .dot.o{background:none;border:1.5px solid var(--dim)}
.row .dot.due{background:var(--crit);border-color:var(--crit)}
.row.paid .nm{color:var(--mut)}
.row.today{background:var(--hl)}
.row .rm{width:26px;font-size:15px;color:var(--dim);font-weight:700;flex-shrink:0;text-align:center}
.row .rm:active{color:var(--crit)}
.row input.inl{height:32px;border:1px solid var(--line2);border-radius:7px;text-align:right;
  padding:0 8px;font-size:15px;font-weight:700;background:var(--bg)}
.row input.inl.amt{width:74px;flex-shrink:0}
.row input.inl.dy{width:46px;flex-shrink:0;text-align:center}
.row input.inl.nm2{flex:1;min-width:0;text-align:left;font-weight:600}

.bar{height:3px;background:var(--line2);flex:1;min-width:36px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink)}
.bar.thin{height:2px}

.range{display:flex;align-items:center;gap:7px;padding:9px 16px;border-bottom:1px solid var(--line)}
.range label{font-size:8.5px;font-weight:800;letter-spacing:1px;color:var(--mut);text-transform:uppercase}
.range input{width:58px;height:34px;border:1px solid var(--line2);border-radius:8px;
  padding:0 8px;font-size:16px;font-weight:800;text-align:center;background:var(--bg);flex-shrink:0}
.range label{flex-shrink:0}
.range button{font-size:8.5px;font-weight:800;letter-spacing:.8px;color:var(--mut);margin-left:auto;padding:0 2px}
.range .rtot{margin-left:auto;font-size:17px;font-weight:800;letter-spacing:-.4px;flex-shrink:0}
.range .rmode{height:28px;padding:0 11px;border:1px solid var(--line2);border-radius:14px;margin-left:4px;
  font-size:8.5px;font-weight:800;letter-spacing:.8px;color:var(--mut);flex-shrink:0;white-space:nowrap}
.range .rmode.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ── the bills table. The screen he actually lives in, so it gets the
      spreadsheet treatment: fixed columns, a running total, everything
      on one screen. ─────────────────────────────────────────────── */
.bhead,.brow{display:grid;grid-template-columns:13px 20px 1fr 62px 66px;column-gap:6px;align-items:center}
.bhead{padding:5px 16px;background:var(--hl);border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);font-size:8.5px;font-weight:800;
  letter-spacing:1px;color:var(--mut);text-transform:uppercase}
.bhead span{white-space:nowrap;overflow:hidden}
.bhead .r{text-align:right}
.brow{padding:7px 16px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.brow.done .nm,.brow.done .am{color:var(--mut);font-weight:600}
.brow.done .dy{color:var(--line2)}
.brow.done .dot{opacity:.5}
.brow .dy{font-size:11px;font-weight:800;color:var(--dim);text-align:center}
.brow.today .dy{color:var(--ink)}
.brow .nm{font-size:13.5px;font-weight:600;letter-spacing:-.2px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;min-width:0;text-align:left;background:none}
.brow .nm i{display:block;font-style:normal;font-size:9.5px;font-weight:600;color:var(--mut);
  margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .nm i.warn{color:var(--crit);font-weight:700}
.brow .am{font-size:13.5px;font-weight:700;letter-spacing:-.3px;text-align:right}
.brow .rn{font-size:12px;font-weight:700;color:var(--dim);text-align:right;letter-spacing:-.2px}
.brow .dot{margin:0 auto}
.brow .dot:disabled{opacity:.45}
.bmon{padding:10px 16px 3px;font-size:8.5px;font-weight:800;letter-spacing:1.2px;
  color:var(--dim);text-transform:uppercase;border-top:1px solid var(--line)}
.brow input.inl{height:30px;font-size:14px}

/* ── debt block ────────────────────────────────────────────── */
.dbt{padding:15px 16px;border-top:1px solid var(--line2);width:100%;text-align:left;display:block}
.dbt+.dbt{margin-top:0}
.dbt:active{background:var(--hl)}
.dbt .l1{display:flex;align-items:baseline;gap:8px;margin-bottom:7px}
.dbt .l1 .nm{flex:1;font-size:14px;font-weight:600;letter-spacing:-.2px}
.dbt .l1 .v{font-size:14px;font-weight:700;letter-spacing:-.3px}
.dbt .l1 .tag{font-size:8.5px;font-weight:800;letter-spacing:.6px;color:var(--mut);
  border:1px solid var(--line2);border-radius:4px;padding:2px 5px}
.dbt .l2{display:flex;align-items:center;gap:9px}
.dbt .l2 .mo{font-size:9.5px;font-weight:800;color:var(--mut);letter-spacing:.3px;
  width:104px;flex-shrink:0}
.dbt .l2 .up{font-size:9.5px;font-weight:800;color:var(--pos);letter-spacing:.2px;flex-shrink:0}
.dbt .l3{display:flex;gap:14px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.dbt .l3 div{flex:1}
.dbt .l3 .n{font-size:14px;font-weight:700;letter-spacing:-.3px}
.dbt .l3 .n.crit{color:var(--crit)}
.dbt .l3 .k{font-size:8.5px;font-weight:800;color:var(--mut);letter-spacing:.6px;margin-top:3px}
.dbt .l4{font-size:10px;font-weight:700;color:var(--mut);line-height:1.45;margin-top:8px}

/* ── capture ───────────────────────────────────────────────── */
.cap{padding:12px 16px 14px;border-bottom:1px solid var(--line)}
.cap textarea{width:100%;min-height:44px;max-height:150px;border:1px solid var(--line2);
  border-radius:10px;padding:11px 12px;font-size:16px;font-weight:500;line-height:1.4;resize:none;
  background:var(--hl)}
.cap textarea::placeholder{color:var(--mut)}
.cap .caprow{display:flex;align-items:center;gap:10px;margin-top:8px}
.cap .hint{flex:1;font-size:10px;font-weight:700;color:var(--mut);line-height:1.4}
.cap .hint b{color:var(--ink);font-weight:800}
.cap .add{height:36px;padding:0 18px;border-radius:9px;background:var(--ink);color:var(--bg);
  font-size:11px;font-weight:800;letter-spacing:.8px;flex-shrink:0}
.cap .add:disabled{opacity:.3}

.ent{display:flex;align-items:flex-start;gap:10px;padding:9px 16px;border-top:1px solid var(--line)}
.ent .tm{font-size:9.5px;font-weight:800;color:var(--dim);width:38px;flex-shrink:0;padding-top:2px;letter-spacing:.2px}
.ent .tx{flex:1;font-size:13.5px;font-weight:500;line-height:1.45;word-break:break-word}
.ent .am{font-size:13.5px;font-weight:800;letter-spacing:-.3px;flex-shrink:0}
.ent .rm{font-size:13px;color:var(--dim);font-weight:700;padding:0 2px;flex-shrink:0}
.ent .rm:active{color:var(--crit)}

/* ── chart ─────────────────────────────────────────────────── */
.chart{padding:6px 16px 18px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .cx{font-size:10px;font-weight:700;color:var(--mut);line-height:1.5;margin-top:12px}
.chart .cx b{color:var(--ink);font-weight:800}

/* ── stat strip ────────────────────────────────────────────── */
.strip{display:flex;border-top:1px solid var(--line)}
.strip div,.strip .cell{flex:1;padding:14px 8px;text-align:center;border-left:1px solid var(--line);min-width:0}
.strip div:first-child,.strip .cell:first-child{border-left:none}
.strip .cell:active{background:var(--hl)}
.strip .n{font-size:21px;font-weight:300;letter-spacing:-1.2px;line-height:1.1}
.strip .n.neg{color:var(--crit)}
.strip .n.pos{color:var(--pos)}
.strip .l{font-size:8.5px;font-weight:800;color:var(--mut);letter-spacing:.7px;margin-top:4px}

/* ── settings ──────────────────────────────────────────────── */
.sr{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);
  width:100%;text-align:left}
.sr:active{background:var(--hl)}
.sr .l{flex:1;min-width:0}
.sr .l .t{font-size:15px;font-weight:600}
.sr .l .d{font-size:11px;color:var(--mut);margin-top:2px;line-height:1.35}
.sr .val{font-size:14px;font-weight:800;color:var(--mut)}
.sr .arrow{font-size:16px;color:var(--dim);font-weight:800}
.sr input.numin{width:92px;height:36px;border:1px solid var(--line2);border-radius:8px;
  text-align:right;padding:0 10px;font-size:16px;font-weight:800}
.sr .cyc{min-width:66px;height:36px;border:1px solid var(--line2);border-radius:8px;
  font-size:14px;font-weight:800;letter-spacing:.3px;flex-shrink:0}
.sr .cyc:active{background:var(--hl)}

/* ── sheet / editor ────────────────────────────────────────── */
/* On a black page a black sheet has no edge, so the way out was invisible.
   The backdrop is now clearly darker than either theme's ground, the sheet
   carries a lifted rule and a shadow, and every one of them gets a grab
   handle and a close button without having to say so. */
.sheet-bg{position:fixed;inset:0;background:var(--scrim);z-index:50;opacity:0;
  transition:opacity .2s;display:flex;align-items:flex-end}
.sheet-bg.on{opacity:1}
.sheet{background:var(--sheet);width:100%;border-radius:20px 20px 0 0;position:relative;
  padding:26px 18px calc(20px + var(--safe-b));transform:translateY(100%);
  border-top:1px solid var(--line2);box-shadow:0 -24px 48px rgba(0,0,0,.55);
  transition:transform .26s cubic-bezier(.32,.72,0,1);max-height:88vh;overflow-y:auto}
.sheet-grab{position:absolute;top:9px;left:50%;transform:translateX(-50%);
  width:36px;height:4px;border-radius:2px;background:var(--line2)}
.sheet-x{position:absolute;top:16px;right:14px;width:32px;height:32px;border-radius:16px;
  background:rgba(127,127,127,.18);color:var(--mut);font-size:13px;font-weight:800;z-index:2}
.sheet-x:active{background:rgba(127,127,127,.34);color:var(--ink)}
.sheet h2{padding-right:36px}
.sheet-bg.on .sheet{transform:translateY(0)}
.sheet h2{font-size:17px;font-weight:800;letter-spacing:-.3px;margin-bottom:3px}
.sheet .sub{font-size:12px;color:var(--mut);font-weight:600;margin-bottom:16px;line-height:1.45}
.sheet .sub b{color:var(--ink);font-weight:800}
.ef{margin-bottom:13px}
.ef label{display:block;font-size:9px;font-weight:800;letter-spacing:.9px;color:var(--mut);
  margin-bottom:5px;text-transform:uppercase}
.ef input,.ef select,.ef textarea{width:100%;height:44px;border:1px solid var(--line2);
  border-radius:10px;padding:0 11px;font-size:16px;font-weight:600;background:var(--bg)}
.ef textarea{height:auto;min-height:76px;padding:11px;line-height:1.45;resize:vertical}
.ef .note{font-size:10.5px;color:var(--mut);font-weight:600;margin-top:5px;line-height:1.45}
.ef .note b{color:var(--ink);font-weight:800}
.efr{display:flex;gap:9px}.efr .ef{flex:1;min-width:0}
.eseg{display:flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.eseg button{flex:1;height:42px;font-size:12px;font-weight:700;background:var(--bg);
  border-left:1px solid var(--line2);min-width:0;padding:0 4px}
.eseg button:first-child{border-left:none}
.eseg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tagrow{display:flex;flex-wrap:wrap;gap:6px}
.tagrow button{height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line2);
  font-size:11px;font-weight:800;letter-spacing:.4px;color:var(--mut)}
.tagrow button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.srow{display:flex;gap:9px;margin-top:6px}
.sbtn{flex:1;height:46px;border-radius:11px;font-size:13px;font-weight:800;
  border:1px solid var(--line2);letter-spacing:.2px}
.sbtn.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sbtn.danger{color:var(--crit);border-color:var(--line2)}
.sbtn:active{opacity:.7}
.brk{border-top:1px solid var(--line);margin:16px 0 14px;padding-top:14px}
.brk .bh{font-size:9px;font-weight:800;letter-spacing:1.1px;color:var(--mut);margin-bottom:11px;text-transform:uppercase}
.kv{display:flex;align-items:baseline;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.kv:first-of-type{border-top:none}
.kv .k{flex:1;font-weight:600;color:var(--mut)}
.kv .v{font-weight:800;letter-spacing:-.2px}
.kv .v.crit{color:var(--crit)}
.kv .v.pos{color:var(--pos)}

/* ── the exercise sheet. Dense on purpose. ─────────────────── */
.search{position:sticky;top:0;z-index:22;background:var(--bg);padding:8px 12px 7px;
  display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
.search input{flex:1;height:36px;border:1px solid var(--line2);border-radius:9px;padding:0 12px;
  background:var(--hl);font-size:16px;font-weight:500}
.search .x{font-size:11px;font-weight:800;color:var(--mut);letter-spacing:.5px;padding:0 4px}
/* Three pages behind one tab. */
.hnav{display:flex;gap:0;border-bottom:1px solid var(--line2);background:var(--bg);
  position:sticky;top:0;z-index:24}
.hnav button{flex:1;height:44px;font-size:11px;font-weight:800;letter-spacing:1.1px;
  text-transform:uppercase;color:var(--mut);border-bottom:2px solid transparent}
.hnav button.on{color:var(--ink);border-bottom-color:var(--ink)}
.hnav button:active{background:var(--hl)}

.jump{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;gap:6px;padding:7px 12px;overflow-x:auto;scrollbar-width:none}
.jump::-webkit-scrollbar{display:none}
.jump button{flex-shrink:0;height:28px;padding:0 12px;border-radius:14px;background:var(--hl);
  border:1px solid var(--line);font-size:11px;font-weight:800;letter-spacing:.6px;color:var(--mut)}
.jump button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.grp{display:flex;align-items:center;gap:8px;padding:14px 14px 5px;cursor:pointer;width:100%;text-align:left}
.grp .gname{font-size:14px;font-weight:800;letter-spacing:-.3px}
.grp .gcount{margin-left:auto;font-size:10px;font-weight:800;color:var(--dim)}
.grp .gchev{width:11px;height:11px;stroke:var(--dim);fill:none;stroke-width:3;stroke-linecap:round;
  stroke-linejoin:round;flex-shrink:0;transition:transform .16s;transform:rotate(90deg)}
.grp.shut .gchev{transform:rotate(0)}
.bph{background:var(--hl);border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  display:grid;align-items:center;padding:4px 12px 4px 14px;
  font-size:9px;font-weight:800;letter-spacing:1.1px;color:var(--mut)}
.bph,.r-main{grid-template-columns:1fr 46px 50px 62px;column-gap:6px}
.bph .num{text-align:right}
.bph .pctb{color:var(--ink);text-decoration:underline;text-underline-offset:2px;
  font-size:9px;font-weight:800;letter-spacing:1.1px}
.r{border-bottom:1px solid var(--line);padding:0 12px 0 14px}
.r.open{background:var(--hl)}
.r-main{display:grid;align-items:baseline;padding:6px 0;line-height:1.2;width:100%;text-align:left}
.r-nm{font-size:13px;font-weight:600;letter-spacing:-.2px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;min-width:0}
.r-n{text-align:right;font-size:13px;font-weight:700;letter-spacing:-.3px}
.r-n.kg{font-size:14px;font-weight:800}
.r-n.nx{color:var(--pos)}
.r-n.none{color:var(--dim);font-weight:500}

/* ── the logger. One weight, then reps. Nothing else in the way. ── */
.log{padding:8px 0 14px}
.lglab{font-size:8.5px;font-weight:800;letter-spacing:1.1px;color:var(--mut);
  text-transform:uppercase;margin-bottom:6px}
.lgw{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:11px}
.lgw .stp{width:44px;height:48px;border:1px solid var(--line2);border-radius:11px;
  font-size:22px;font-weight:500;background:var(--bg);flex-shrink:0}
.lgw .stp:active{background:var(--line2)}
.lgw .wnum{width:92px;height:48px;border:1px solid var(--line2);border-radius:11px;text-align:center;
  font-size:22px;font-weight:800;background:var(--bg);flex-shrink:0}
.lgw .wu{font-size:10px;font-weight:800;color:var(--mut);letter-spacing:.8px}
.lgw .wchip{height:28px;padding:0 10px;border-radius:14px;border:1px solid var(--line2);
  font-size:10px;font-weight:800;color:var(--mut);letter-spacing:.2px}
.lgw .wchip:active{background:var(--line2);color:var(--ink)}
.lgs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px}
.setbox{width:56px;height:52px;border:1px solid var(--line2);border-radius:11px;text-align:center;
  font-size:20px;font-weight:800;background:var(--bg)}
.setbox.done{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.setbox::placeholder{color:var(--dim);font-weight:500}
.setadd{width:56px;height:52px;border:1px dashed var(--line2);border-radius:11px;
  font-size:20px;font-weight:500;color:var(--mut)}
.lgm{font-size:10.5px;font-weight:700;color:var(--mut);line-height:1.6;margin-bottom:10px}
.lgm b{color:var(--ink);font-weight:800}
.lgn{width:100%;height:40px;border:1px solid var(--line2);border-radius:10px;padding:0 11px;
  font-size:15px;font-weight:600;background:var(--bg);margin-bottom:10px}
.lgh{border-top:1px solid var(--line2);padding-top:4px}
.lgr{display:flex;align-items:baseline;gap:9px;padding:6px 0;font-size:12px}
.lgr .d{font-size:10px;font-weight:800;color:var(--mut);width:54px;flex-shrink:0}
.lgr .s{flex:1;font-weight:700}
.lgr .w{font-size:10.5px;font-weight:700;color:var(--dim)}
.lgr .x{font-size:11px;color:var(--dim);font-weight:700;padding:0 3px}
.lgr .x:active{color:var(--crit)}
.lgacts{display:flex;gap:8px;margin-top:10px}
.lgacts button{flex:1;height:38px;border:1px solid var(--line2);border-radius:10px;font-size:10px;
  font-weight:800;letter-spacing:.9px;color:var(--mut)}

/* ── the bar you use between sets ─────────────────────────────── */
.wkpad{height:96px}
#wk{position:fixed;left:8px;right:8px;bottom:calc(56px + var(--safe-b));z-index:34;
  display:none;align-items:stretch;gap:8px;padding:9px 10px;
  background:var(--sheet);border:1px solid var(--line2);border-radius:16px;
  box-shadow:0 8px 28px rgba(0,0,0,.45)}
#wk.on{display:flex}
#wk .wkL,#wk .wkR{display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0}
#wk .wkgo{min-width:82px;height:42px;border-radius:11px;background:var(--ink);color:var(--bg);
  font-size:14px;font-weight:800;letter-spacing:-.2px;padding:0 10px}
#wk .wkgo.on{font-variant-numeric:tabular-nums}
#wk .wkgo.over{background:var(--crit);color:#fff}
#wk .wksw{min-width:74px;height:42px;border-radius:11px;border:1px solid var(--line2);
  font-size:14px;font-weight:800;letter-spacing:-.2px;color:var(--ink);padding:0 8px}
#wk .wksw.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#wk .wkx{font-size:8.5px;font-weight:800;letter-spacing:.6px;color:var(--mut);height:14px}
#wk .wkx.idle{color:var(--dim)}
#wk .wkm{display:flex;align-items:center;gap:3px;height:14px}
#wk .wkm input{width:30px;height:14px;border:none;background:none;text-align:right;
  font-size:9px;font-weight:800;color:var(--ink);padding:0}
#wk .wkm i{font-style:normal;font-size:8.5px;font-weight:800;color:var(--mut);letter-spacing:.6px}
#wk .wkC{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px;
  overflow:hidden}
#wk .wkC span{font-size:9.5px;font-weight:700;color:var(--mut);letter-spacing:.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#wk .wkC b{color:var(--ink);font-weight:800;letter-spacing:.6px}
#wk .wkC .idle{color:var(--dim);font-weight:600}

/* ── calendar ──────────────────────────────────────────────── */
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:13px 18px 9px}
.cal-nav button{width:40px;height:40px;font-size:22px;font-weight:500;border-radius:10px}
.cal-nav button:active{background:var(--hl)}
.cal-nav .mo{font-size:15px;font-weight:800;letter-spacing:-.3px}
.dow{display:grid;grid-template-columns:repeat(7,1fr);padding:0 12px}
.dow div{text-align:center;font-size:9.5px;font-weight:800;color:var(--mut);padding:3px 0}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:0 12px}
.cd{aspect-ratio:1;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;position:relative;border:1px solid transparent}
.cd.pad{visibility:hidden}
.cd.went{background:var(--ink);color:var(--bg)}
.cd.today{border-color:var(--ink)}
.cd.went.today{border-color:var(--mut)}
.cd.future{color:var(--dim)}

/* ── goals ─────────────────────────────────────────────────── */
.quest{padding:13px 16px;border-top:1px solid var(--line);width:100%;text-align:left;display:block}
.quest:active{background:var(--hl)}
.quest.pin{border-left:2px solid var(--ink)}
.quest .qh{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
.quest .qh .nm{flex:1;font-size:15px;font-weight:700;letter-spacing:-.3px}
.quest .qh .pct{font-size:11px;font-weight:800;color:var(--mut)}
.quest .qt{font-size:8.5px;font-weight:800;letter-spacing:.7px;color:var(--dim);
  border:1px solid var(--line2);border-radius:4px;padding:2px 5px}
.step{display:flex;align-items:center;gap:10px;padding:7px 0 7px 2px}
.step .bx{width:16px;height:16px;border:1.5px solid var(--dim);border-radius:4px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;background:none}
.step.done .bx{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.step.lock .bx{border-style:dashed}
.step .sn{flex:1;font-size:12.5px;font-weight:600;letter-spacing:-.1px;min-width:0}
.step.done .sn{color:var(--mut)}
.step.lock .sn{color:var(--dim)}
.step .sv{font-size:10px;font-weight:800;color:var(--mut);flex-shrink:0}
.step .sv.pos{color:var(--pos)}
.step .rm{font-size:12px;color:var(--dim);font-weight:700;padding:0 3px;flex-shrink:0}

/* ── grid / bulk edit ──────────────────────────────────────── */
.gwrap{overflow-x:auto;border-top:1px solid var(--line);-webkit-overflow-scrolling:touch}
table.g{border-collapse:collapse;width:100%;min-width:100%}
table.g th{font-size:8.5px;font-weight:800;letter-spacing:.9px;color:var(--mut);text-align:left;
  padding:7px 8px;background:var(--hl);border-bottom:1px solid var(--line2);white-space:nowrap;text-transform:uppercase}
table.g td{padding:0;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
table.g td:last-child{border-right:none}
table.g input,table.g select{width:100%;height:38px;padding:0 8px;font-size:14px;font-weight:600;
  border-radius:0;background:transparent}
table.g input.n{text-align:right;font-weight:700}
table.g input:focus{background:var(--hl);outline:1px solid var(--ink);outline-offset:-1px}
table.g td.act{width:34px;text-align:center}
table.g td.act button{font-size:14px;color:var(--dim);font-weight:700;width:100%;height:38px}
table.g td.act button:active{color:var(--crit)}
.gnote{font-size:10.5px;color:var(--mut);font-weight:600;padding:11px 16px;line-height:1.5}
.gnote b{color:var(--ink);font-weight:800}

/* ── empty / stage ─────────────────────────────────────────── */
.empty{padding:48px 28px;text-align:center;color:var(--mut)}
.empty h3{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:6px;letter-spacing:-.2px}
.empty p{font-size:13px;line-height:1.55;max-width:32ch;margin:0 auto}

#nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);
  display:flex;z-index:30;padding-bottom:var(--safe-b)}
.ni{flex:1;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;color:var(--dim);font-size:8.5px;font-weight:800;letter-spacing:.5px}
.ni svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.ni.on{color:var(--ink)}

.toast{position:fixed;left:50%;bottom:calc(64px + var(--safe-b));transform:translateX(-50%) translateY(8px);
  background:var(--ink);color:var(--bg);font-size:12px;font-weight:700;padding:10px 15px;
  border-radius:9px;opacity:0;transition:opacity .2s,transform .2s;z-index:99;pointer-events:none;
  white-space:nowrap;display:inline-flex;align-items:center;gap:11px;max-width:88vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast .u{font-weight:800;letter-spacing:.5px;border:1px solid rgba(127,127,127,.5);
  padding:3px 8px;border-radius:5px;pointer-events:auto}
.spacer{height:30px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ═══ persistence ═════════════════════════════════════════════
   Every read and write goes through load/save. That is the only reason
   a sync backend is a day's work later instead of a rewrite: nothing
   else in the app knows where the data lives. */
function load(){
  let raw=null;
  try{raw=localStorage.getItem(KEY)||localStorage.getItem(BKEY)
        ||OLDKEYS.map(k=>localStorage.getItem(k)).filter(Boolean)[0];}catch(e){}
  if(raw){
    try{ adopt(JSON.parse(raw)); }catch(e){ console.error('load',e); }
  }
  attachCatalogue();
}
function adopt(d){
  Object.keys(BLANK).forEach(k=>{
    if(k==='settings'||k==='meta'||k==='car'||k==='nutrition')return;
    if(Array.isArray(BLANK[k]))D[k]=Array.isArray(d[k])?d[k]:[];
  });
  D.workout=d.workout&&d.workout.start?d.workout:null;
  D.settings=Object.assign({},DEFAULTS,d.settings||{});
  D.meta=Object.assign({paid:{}},d.meta||{});
  D.car=Object.assign({},d.car||{});
  D.nutrition=Object.assign({kcal:0,protein:0,carbs:0,fat:0},d.nutrition||{});
  if(!D.meta.paid||typeof D.meta.paid!=='object')D.meta.paid={};
  D.settings.collapsed=Object.assign({},D.settings.collapsed||{});
  migrate();
  closeStaleWorkout();
}
/* Debts imported from the spreadsheet carry a single "original" figure that
   is really the total of every payment — interest already baked in. Label
   them honestly as schedules so the app never pretends to know a rate it
   was never given. */
function migrate(){
  D.debts.forEach(d=>{
    if(!d.kind){
      d.kind='schedule';
      if(d.total==null)d.total=+d.original||0;
    }
    delete d.original;
  });
  D.targets.forEach(t=>{
    if(!Array.isArray(t.steps))t.steps=[];
    if(!t.tier)t.tier=t.source?'life':'month';
  });
}
/* Layer the catalogue over stored exercises without touching anything you
   have set by hand: names and grouping come from the app, numbers are yours. */
function attachCatalogue(){
  const by={};D.exercises.forEach(e=>by[e.id]=e);
  CAT.forEach(c=>{
    const e=by[c.id];
    if(!e){D.exercises.push(Object.assign({},c));return;}
    ['name','cat','bp','type'].forEach(k=>{if(e[k]==null)e[k]=c[k];});

}
/* Forgot to hit stop and the clock ran overnight. End it at the last set
   actually logged that day rather than inventing a duration; if nothing was
   logged, the workout never really happened, so drop it. */
function closeStaleWorkout(){
  const w=D.workout;if(!w)return;
  const d=ymd(new Date(w.start));
  if(d===today())return;
  const ends=D.logs.filter(l=>l.date===d).map(l=>l.ts||0);
  const end=ends.length?Math.max.apply(null,ends):0;
  if(end>w.start)D.sessions.push({id:uid('s'),date:d,start:w.start,end:end});
  D.workout=null;
}

/* ═══════════════════════════════════════════════════════════════
   THE DEBT ENGINE

   Consumer debt comes in two shapes, and conflating them is what makes
   a balance wrong.

   'schedule'  You know the total you will hand over and the monthly
               payment; the rate is already inside those figures. This is
               what a spreadsheet holds. Its balance is "payments left",
               which is what it costs to see the agreement out — NOT what
               it costs to clear it today.

   'apr'       You know what you actually borrowed and the rate. The app
               amortises month by month: interest is added, the payment
               comes off, and what is left is the real outstanding
               principal — the figure a settlement quote is built from.

   The gap between those two numbers is the interest you have not paid
   yet, and it is the whole reason to model this properly: it tells you
   what overpaying is worth.
   ═══════════════════════════════════════════════════════════════ */

/* UK lenders quote APR as an effective annual rate, so the monthly rate
   compounds to it rather than being a twelfth of it. */
const monthlyRate=apr=>apr?Math.pow(1+(+apr||0)/100,1/12)-1:0;
/* A promotional period is just a different rate for the first n months. */
function rateAt(d,m){
  const promo=+d.promoMonths||0;
  return monthlyRate(m<promo?(+d.promoApr||0):(+d.apr||0));
}

/* Payments made. A credit agreement names the date of the FIRST payment, so
   that date is payment one — the spreadsheet treated it as the day a clock
   started and came out one payment short on every debt. A recorded payment
   overrides the arithmetic entirely: nothing beats knowing. */
function monthsPaid(d){
  const n=d.months|0;
  const a=d.paidAnchor;
  if(a&&a.date)return clamp((a.count|0)+cyclesBetween(a.date,today()),0,n);
  const f=firstPayment(d),t=new Date();
  let m=(t.getFullYear()-f.getFullYear())*12+(t.getMonth()-f.getMonth());
  if(t.getDate()>=f.getDate())m++;
  return clamp(m,0,n);
}
/* Agreements differ, and getting this wrong is a whole payment either way.
   a personal loan may name a first-payment date, while car HP commonly says
   instalments commence one month from the date of the agreement. So the debt
   has to say which its date is rather than the app guessing. */
function firstPayment(d){
  const s=new Date(d.start+'T00:00');
  return d.startIs==='agreement'
    ? new Date(s.getFullYear(),s.getMonth()+1,s.getDate())
    : s;
}

/* Walk the schedule. Returns the balance after `upto` payments, plus the
   interest charged along the way. */
function amortise(d,upto){
  const n=d.months|0,pay=+d.monthly||0,balloon=+d.balloon||0;
  let bal=+d.principal||0,interest=0;
  for(let m=0;m<Math.min(upto,n);m++){
    const i=bal*rateAt(d,m);
    interest+=i;
    bal=bal+i-pay-(m===n-1?balloon:0);
    if(bal<0)bal=0;
  }
  return {balance:bal,interest:interest};
}

/* A credit line has no term and no principal — just a balance that grows by
   interest and shrinks by whatever you pay over it. How long it takes is
   something you work out, not something the agreement tells you, and if the
   payment ever stops covering the interest it never ends at all. */
/* Walk the balance down month by month. The last payment is only ever what is
   left, so counting it as a full one overstates the interest. */
function runDown(B,r,pay,spend,cap,minPct,floor){
  let bal=B,interest=0,paid=0,months=0;
  cap=cap||2400;
  while(bal>0.005&&months<cap){
    /* A minimum payment is a percentage of the balance, so it shrinks as the
       balance does — which is why it never finishes. A fixed payment of the
       same size does, and quickly. The statement adds the interest first and
       then works the minimum out from the closing figure, so do that here too:
       it is the difference between a forecast that is right and one that is
       three pounds light every month. */
    const i=bal*r;
    const due=bal+i+(spend||0);
    let p=minPct!=null?Math.max(floor||0,due*(r+minPct)):pay;
    p=Math.min(p,due);
    if(p<=i+(spend||0))return {months:Infinity,interest:Infinity,paid:Infinity,cleared:false};
    interest+=i;bal=due-p;paid+=p;months++;
  }
  return {months:months,interest:interest,paid:paid,cleared:bal<=0.005};
}
/* Whole payment cycles between two dates, counted on the anchor's day of the
   month — which, because the anchor is set when a payment is recorded, is the
   day he actually pays. */
function cyclesBetween(from,to){
  const s=new Date(from+'T00:00'),t=new Date(to+'T00:00');
  let n=(t.getFullYear()-s.getFullYear())*12+(t.getMonth()-s.getMonth());
  if(t.getDate()<s.getDate())n--;
  return Math.max(0,n);
}
/* Roll a balance forward by n statement cycles, applying the interest and the
   payment the account assumes gets made. Without this the balance sits frozen
   at whatever was last typed while the dates march on — which is exactly how
   the spreadsheet this replaces came to be three months out of date. */
function rollBalance(d,n){
  const r=monthlyRate(d.apr),p=(+d.minPct||0)/100,floor=+d.minFloor||5,spend=+d.spend||0;
  let bal=Math.max(0,+d.balance||0);
  for(let k=0;k<n&&bal>0.005;k++){
    const i=bal*r,closing=bal+i+spend;
    let due=d.payMin?Math.max(floor,closing*(r+p)):(+d.monthly||0);
    due=Math.min(due,closing);
    bal=Math.max(0,closing-due);
  }
  return bal;
}
/* The balance as it stands today, given nothing has been recorded since. */
function projectedBalance(d){
  const from=d.balanceAt||null;
  const n=from?cyclesBetween(from,today()):0;
  return {balance:n?rollBalance(d,n):Math.max(0,+d.balance||0),cycles:n,from:from};
}

/* What every future payment will be. A minimum is a percentage of the
   statement balance, so once you know the rate and the balance the whole
   schedule is already determined — there is no reason to guess at it a month
   at a time. Row 0 is the next payment due. */
function minSchedule(d,n){
  const r=monthlyRate(d.apr),p=(+d.minPct||0)/100,floor=+d.minFloor||5;
  const spend=+d.spend||0,fixed=d.payMin?null:(+d.monthly||0);
  const proj=projectedBalance(d);
  let bal=proj.balance;
  /* Anchor the dates to the last payment, not to today, so the first row is
     genuinely the next one due rather than always "next month". */
  const anchor=d.balanceAt?new Date(d.balanceAt+'T00:00'):new Date();
  const base=d.balanceAt?proj.cycles:0;
  const rows=[];
  for(let k=0;k<n&&bal>0.005;k++){
    const interest=bal*r;
    const closing=bal+interest+spend;
    let due=fixed!=null?fixed:Math.max(floor,closing*(r+p));
    due=Math.min(due,closing);
    if(due<=interest+spend)break;                 // it stops going anywhere
    const when=new Date(anchor.getFullYear(),anchor.getMonth()+base+k+1,1);
    rows.push({y:when.getFullYear(),m:when.getMonth(),
               label:monLabel(when.getFullYear(),when.getMonth()),
               interest:interest,closing:closing,due:due,after:closing-due});
    bal=closing-due;
  }
  return rows;
}
function revolvingCalc(d){
  const proj=projectedBalance(d);
  const B=proj.balance, r=monthlyRate(d.apr);
  const pay=+d.monthly||0, spend=+d.spend||0, opening=+d.opening||B;
  const interestNow=B*r, pctMin=(+d.minPct||0)/100, floor=+d.minFloor||5;
  /* The statement's minimum is a flat percentage of the balance that already
     includes the interest — 1.80% interest plus 2% capital reads as 3.80%. */
  const minPay=pctMin>0?Math.max(floor,Math.min(B*(1+r)+spend,(B*(1+r)+spend)*(r+pctMin))):0;
  const usingMin=!!d.payMin&&pctMin>0;
  const payNow=usingMin?minPay:pay;
  const stalled=B>0&&(payNow-spend-interestNow)<=0;
  const run=stalled?{months:Infinity,interest:Infinity,paid:Infinity}
    :runDown(B,r,payNow,spend,2400,usingMin?pctMin:null,floor);
  const n=run.months;
  const now=new Date();
  const free=new Date(now.getFullYear(),now.getMonth()+(stalled?600:n)+1,1);
  const endM=new Date(free.getFullYear(),free.getMonth()-1,1);
  const paymentsLeft=run.paid;
  return {revolving:true,stalled:stalled,
          paid:0,left:stalled?Infinity:n,months:stalled?Infinity:n,
          paymentsLeft:paymentsLeft,
          settle:B,                                   // a credit line settles at its balance
          interestLeft:run.interest,interestTotal:run.interest,
          interestNow:interestNow,minPay:minPay,payment:payNow,usingMin:usingMin,
          cycles:proj.cycles,balanceFrom:proj.from,stored:Math.max(0,+d.balance||0),
          principal:B,ratedKnown:+d.apr>0,
          progress:opening>0?clamp(1-B/opening,0,1):0,
          endLabel:monLabel(endM.getFullYear(),endM.getMonth()),
          freeLabel:monLabel(free.getFullYear(),free.getMonth()),
          freeY:free.getFullYear(),freeM:free.getMonth(),
          done:B<=0};
}

function debtCalc(d){
  if(d.kind==='revolving')return revolvingCalc(d);
  const n=d.months|0,paid=monthsPaid(d),left=n-paid,pay=+d.monthly||0,balloon=+d.balloon||0;
  const a=d.paidAnchor;
  const anchor=(a&&a.date)?new Date(a.date+'T00:00'):firstPayment(d);
  const ahead=(a&&a.date)?(n-(a.count|0)):(n-1);
  const end=new Date(anchor.getFullYear(),anchor.getMonth()+ahead,1);  // the final payment
  const free=new Date(end.getFullYear(),end.getMonth()+1,1);
  const paymentsLeft=left<=0?0
    :(d.kind==='schedule'&&d.total!=null)
      ? Math.max(0,(+d.total||0)-paid*pay)        // keeps any fee or final payment in the balance
      : Math.max(0,left*pay+balloon);

  let settle=paymentsLeft,interestLeft=0,interestTotal=null,principal=null,known=false;
  if(d.kind==='apr'&&+d.principal>0){
    settle=left<=0?0:amortise(d,paid).balance;
    interestLeft=Math.max(0,paymentsLeft-settle);
    interestTotal=amortise(d,n).interest;
    principal=+d.principal;
    known=true;
  }
  return {paid:paid,left:left,months:n,
          paymentsLeft:paymentsLeft,        // what it costs to see it out
          settle:settle,                    // what it costs to clear today
          interestLeft:interestLeft,        // the difference, and the prize
          interestTotal:interestTotal,      // over the whole agreement
          principal:principal,ratedKnown:known,
          payment:pay,usingMin:false,progress:n?paid/n:0,
          endLabel:monLabel(end.getFullYear(),end.getMonth()),
          freeLabel:monLabel(free.getFullYear(),free.getMonth()),
          freeY:free.getFullYear(),freeM:free.getMonth(),
          done:left<=0};
}

/* ── solvers ──────────────────────────────────────────────────
   You rarely have all four of principal, payment, term and rate. Give
   any three and these work out the fourth, which is usually the only
   way to find a rate nobody ever told you. */

/* Present value of the payment stream at a given monthly rate. */
function pvOf(pay,months,i,balloon){
  balloon=balloon||0;
  if(i<=0)return pay*months+balloon;
  return pay*(1-Math.pow(1+i,-months))/i + balloon*Math.pow(1+i,-months);
}
/* The rate that makes those payments settle exactly that principal.
   Bisection: slower than Newton, but it cannot diverge, and the range
   covers everything from 0% to a 300% APR payday loan. */
function solveApr(principal,pay,months,balloon){
  principal=+principal;pay=+pay;months=months|0;
  if(!(principal>0)||!(pay>0)||!(months>0))return null;
  const at0=pvOf(pay,months,0,balloon);               // total handed over, undiscounted
  if(at0<principal-0.005)return null;                // never repays it — no rate fits
  if(at0<=principal+0.005)return 0;                  // repays exactly what was borrowed
  let lo=0,hi=0.15;                                  // 0 to ~435% a year, monthly
  while(pvOf(pay,months,hi,balloon)>principal&&hi<1)hi*=2;
  for(let k=0;k<200;k++){
    const mid=(lo+hi)/2;
    if(pvOf(pay,months,mid,balloon)>principal)lo=mid;else hi=mid;
  }
  const i=(lo+hi)/2;
  return (Math.pow(1+i,12)-1)*100;
}
function solvePayment(principal,apr,months,balloon){
  const i=monthlyRate(apr),n=months|0,b=+balloon||0;
  if(!(n>0))return null;
  if(i<=0)return (principal-b)/n;
  return (principal-b*Math.pow(1+i,-n))*i/(1-Math.pow(1+i,-n));
}
const solvePrincipal=(pay,apr,months,balloon)=>pvOf(+pay||0,months|0,monthlyRate(apr),+balloon||0);

const debtSettle=()=>sum(D.debts,d=>debtCalc(d).settle);
const fin=v=>isFinite(v)?v:0;
const debtPaymentsLeft=()=>sum(D.debts,d=>fin(debtCalc(d).paymentsLeft));
const debtService=()=>sum(D.debts.filter(d=>!debtCalc(d).done),d=>debtCalc(d).payment);
const debtInterestLeft=()=>sum(D.debts,d=>fin(debtCalc(d).interestLeft));
const debtsRated=()=>D.debts.filter(d=>debtCalc(d).ratedKnown).length;

/* ═══ money ═══════════════════════════════════════════════════ */
const activeLedger=()=>D.ledger.filter(l=>l.active!==false);
const monthlyLines=()=>activeLedger().filter(l=>l.cadence==='monthly')
  .sort((a,b)=>a.day-b.day||a.name.localeCompare(b.name));
const annualLines=()=>activeLedger().filter(l=>l.cadence==='annual')
  .sort((a,b)=>(a.month-b.month)||(a.day-b.day));
/* A bill that services a minimum-payment credit line has no fixed amount —
   it is whatever the statement says next. Read it off the schedule rather than
   making him round it up and hope. */
function billAmount(l){
  const d=l.debtId?D.debts.find(x=>x.id===l.debtId):null;
  if(d&&d.kind==='revolving'&&d.payMin){
    const hist=d.history||[],last=hist.length?hist[hist.length-1]:null;
    if(last&&ymOf(last.date)===ymOf(today())&&isPaid(l,ymOf(today()),new Date().getDate()))
      return roundUp(+last.amount||0);
    const s=minSchedule(d,1);
    if(s.length)return roundUp(s[0].due);
  }
  return roundUp(+l.amount||0);
}
/* How much of a bill is actually the debt. A phone bill is airtime plus a
   device plan; only the device half stops when the plan ends. */
function debtPart(l){
  const d=D.debts.find(x=>x.id===l.debtId);
  if(!d)return 'Debt payment';
  const pay=debtCalc(d).payment||0,amt=+l.amount||0;
  return (amt-pay>0.5)
    ? money(pay,true)+' of this is the debt, the rest is service'
    : 'Debt payment';
}
const isForecast=l=>{
  const d=l.debtId?D.debts.find(x=>x.id===l.debtId):null;
  return !!(d&&d.kind==='revolving'&&d.payMin);
};
/* Rounding up is a cushion, not a correction: it changes what the app asks you
   to set aside, never what is stored. Applied here so every total downstream
   agrees with every row above it. */
const roundUp=n=>{const r=+D.settings.roundTo||0;return r?Math.ceil((+n||0)/r)*r:(+n||0);};
const monthlyTotal=()=>sum(monthlyLines(),billAmount);

/* Every bill this month in date order, each carrying the running total of what
   is still unpaid up to and including it. Read down the last column and any
   "how much do I need by the 17th" question is already answered. */
/* A period is two days of the month. 17th to 5th wraps into next month, which
   is what a pay cycle does; 3rd to 24th does not. No calendar, no month
   headings — the list stays the ordinary monthly one either way. */
const inWindow=(day,from,to)=>from<=to?(day>=from&&day<=to):(day>=from||day<=to);

/* A forecast minimum is a different figure next month, so a bill that wraps
   past the month end takes next month's row from the schedule. */
function nextMonthAmount(l){
  const d=l.debtId?D.debts.find(x=>x.id===l.debtId):null;
  if(d&&d.kind==='revolving'&&d.payMin){
    const n=new Date(),t=new Date(n.getFullYear(),n.getMonth()+1,1);
    const row=minSchedule(d,24).find(r=>r.y===t.getFullYear()&&r.m===t.getMonth());
    if(row)return roundUp(row.due);
  }
  return roundUp(+l.amount||0);
}

/* The bills falling in the period, in the order they land, each carrying the
   running total of what is still unpaid up to and including it. */
function rangeRows(from,to){
  const ym=ymOf(today()),dayNow=new Date().getDate(),wrap=from>to;
  const hit=monthlyLines().filter(l=>inWindow(l.day,from,to));
  const ordered=wrap
    ? hit.filter(l=>l.day>=from).concat(hit.filter(l=>l.day<from))
    : hit;
  let run=0;
  return ordered.map(l=>{
    const next=wrap&&l.day<from;                 // lands after the month rolls over
    const paid=!next&&isPaid(l,ym,dayNow);
    const amount=next?nextMonthAmount(l):billAmount(l);
    if(!paid)run+=amount;
    return {l:l,day:l.day,paid:paid,amount:amount,running:paid?null:run,next:next,
            due:!paid&&!next&&l.day<dayNow,today:!next&&l.day===dayNow};
  });
}

const annualTotal=()=>sum(annualLines(),l=>+l.amount||0);
const annualPerMonth=()=>annualTotal()/12;
function outgoings(){
  const s=D.settings;
  return monthlyTotal()+(+s.food||0)+(+s.fuel||0)+annualPerMonth();
}
const netPosition=()=>(+D.settings.wage||0)-outgoings();

/* Is a bill paid this month? Auto-ticks as the date passes, exactly like
   the sheet, but a manual override wins — some things fail, some go early. */
const paidKey=(l,ym)=>ym+':'+l.id;
function isPaid(l,ym,dayNow){
  const k=paidKey(l,ym);
  if(k in D.meta.paid)return !!D.meta.paid[k];
  return dayNow>=l.day;
}
function togglePaid(id){
  const l=D.ledger.find(x=>x.id===id);if(!l)return;
  const now=new Date(),ym=ymOf(today());
  D.meta.paid[paidKey(l,ym)]=!isPaid(l,ym,now.getDate());
  save();haptic(6);render();
}

/* A debt payment can only free up what actually leaves the account: a phone
   bill may be airtime plus a device plan, so clearing it returns only the
   device half. Cap the unlock at whichever is smaller. */
function linkedBill(d){
  const pay=debtCalc(d).payment||0;
  const l=D.ledger.find(x=>x.debtId===d.id&&x.active!==false);
  return l?Math.min(+l.amount||0,pay):pay;
}
/* Net position projected forward, stepping up each time a debt ends and its
   payment stops leaving the account. Zero behaviour change assumed. */
function projection(months){
  const base=outgoings(),wage=+D.settings.wage||0,out=[];
  const now=new Date(),y0=now.getFullYear(),m0=now.getMonth();
  for(let i=0;i<months;i++){
    const y=y0+Math.floor((m0+i)/12),m=(m0+i)%12;
    let freed=0;
    D.debts.forEach(d=>{
      const c=debtCalc(d);
      if(!c.stalled&&(y>c.freeY||(y===c.freeY&&m>=c.freeM)))freed+=linkedBill(d);
    });
    out.push({y:y,m:m,net:wage-(base-freed),freed:freed});
  }
  return out;
}

/* ═══ entries — the day's page ═══════════════════════════════
   One capture surface. A line with a £ amount is a spend; a line without
   one is a note. Nothing else to learn, and nothing is lost: both keep
   their full text. */
function parseEntry(text){
  let amount=null;
  const g=text.match(/£\s?(\d+(?:\.\d{1,2})?)/);
  if(g)amount=parseFloat(g[1]);
  return {amount:amount,text:text.trim()};
}
function addEntry(){
  const t=DRAFT.trim();if(!t)return;
  const p=parseEntry(t);
  D.entries.push({id:uid('e'),date:today(),ts:Date.now(),text:p.text,amount:p.amount});
  DRAFT='';save();haptic([8,26,8]);
  toast(p.amount!=null?'Logged '+money(p.amount,p.amount%1!==0):'Noted');
  render();
}
function delEntry(id){
  const i=D.entries.findIndex(e=>e.id===id);if(i<0)return;
  const snap=D.entries[i];D.entries.splice(i,1);save();render();
  toast('Deleted',()=>{D.entries.splice(Math.min(i,D.entries.length),0,snap);save();render();});
}
/* Food and fuel are budgets until something is logged against them. Fill-ups
   already recorded on the Car page count as fuel without being typed twice. */
function spendsIn(kind,ym){
  let t=sum(D.spends.filter(x=>x.kind===kind&&ymOf(x.date)===ym),x=>x.amount);
  if(kind==='fuel')t+=sum(D.fuel.filter(f=>ymOf(f.date)===ym),f=>f.cost);
  return t;
}
const spentThisMonth=kind=>spendsIn(kind,ymOf(today()));
/* An average worth showing needs whole months, so drop the one in progress. */
function spendAverage(kind){
  const months={};
  D.spends.filter(x=>x.kind===kind).forEach(x=>{months[ymOf(x.date)]=1;});
  if(kind==='fuel')D.fuel.forEach(f=>{months[ymOf(f.date)]=1;});
  const done=Object.keys(months).filter(m=>m!==ymOf(today()));
  if(!done.length)return null;
  return sum(done,m=>spendsIn(kind,m))/done.length;
}
const entriesOn=ds=>D.entries.filter(e=>e.date===ds).sort((a,b)=>b.ts-a.ts);
const spendThisMonth=()=>sum(D.entries.filter(e=>e.amount!=null&&ymOf(e.date)===ymOf(today())),e=>e.amount);

/* ═══ training maths ══════════════════════════════════════════ */
const exById=id=>D.exercises.find(e=>e.id===id);
const isTime=e=>e.type==='time';
const isBw=e=>e.type==='bodyweight';
const incOf=e=>e.inc||INC[e.type]||2.5;
const plate=(v,e)=>{const i=incOf(e);return i?Math.round(v/i)*i:Math.round(v);};
function stepUp(v,e){const i=incOf(e);if(!i)return Math.round(v)+1;
  return Math.round((v+i)/i)*i;}
/* Epley. Above about 15 reps the formula stops meaning anything, so don't
   pretend it does. */
const epley=(w,r)=>(!w||!r||r>15)?0:w*(1+r/30);
function logsFor(id){return D.logs.filter(l=>l.exId===id).sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts);}
const todayLog=id=>D.logs.find(l=>l.exId===id&&l.date===today())||null;
function estMax(e){
  let best=0;
  logsFor(e.id).slice(0,12).forEach(l=>(l.sets||[]).forEach(s=>{
    const v=epley(s.w!=null?s.w:l.w,s.reps);if(v>best)best=v;}));
  return best;
}
function bestEffort(e){
  let best=null;
  logsFor(e.id).forEach(l=>(l.sets||[]).forEach(s=>{
    const w=s.w!=null?s.w:l.w,v=epley(w,s.reps);
    if(v&&(!best||v>best.v))best={v:v,w:w,reps:s.reps,date:l.date};}));
  return best;
}
function lastSession(e,incToday){
  const ls=logsFor(e.id).filter(l=>incToday||l.date!==today());
  return ls.length?ls[0]:null;
}
/* What to put on the bar next. Hit the rep goal on every set last time and
   it steps the weight up; otherwise it holds and tells you what's left. */
function nextWeight(e){
  const goal=+D.settings.repGoal||12;
  const last=lastSession(e,false);
  if(!last||!(last.sets||[]).length)return null;
  const w=last.sets[0].w!=null?last.sets[0].w:last.w;
  if(w==null)return null;
  const allHit=last.sets.every(s=>(s.reps||0)>=goal);
  return allHit?{w:stepUp(w,e),up:true}:{w:w,up:false};
}
const sessionsOn=ds=>D.sessions.filter(s=>s.date===ds);
const trainedOn=ds=>D.logs.some(l=>l.date===ds)||sessionsOn(ds).length>0;
function trainedThisWeek(){
  const n=new Date(),dow=(n.getDay()+6)%7,out=[];
  for(let i=0;i<7;i++){
    const d=new Date(n.getFullYear(),n.getMonth(),n.getDate()-dow+i);
    out.push({ds:ymd(d),done:trainedOn(ymd(d)),future:d>n});
  }
  return out;
}

/* ═══ car maths ═══════════════════════════════════════════════
   MPG needs two fill-ups: the litres you just put in replaced exactly what
   you burned since the last one, so the pair gives miles per gallon. */
function fuelStats(){
  const f=D.fuel.slice().sort((a,b)=>(a.odo||0)-(b.odo||0));
  const legs=[];
  for(let i=1;i<f.length;i++){
    const miles=(+f[i].odo||0)-(+f[i-1].odo||0);
    const litres=+f[i].litres||0,cost=+f[i].cost||0;
    if(miles>0&&litres>0)
      legs.push({miles:miles,litres:litres,cost:cost,date:f[i].date,
                 mpg:miles/(litres/LITRES_PER_GAL),cpm:cost/miles});
  }
  const m=sum(legs,l=>l.miles),lt=sum(legs,l=>l.litres),c=sum(legs,l=>l.cost);
  return {legs:legs,miles:m,litres:lt,cost:c,
          mpg:lt?m/(lt/LITRES_PER_GAL):0,
          cpm:m?c/m:0,
          last:legs.length?legs[legs.length-1]:null,
          odo:f.length?Math.max.apply(null,f.map(x=>+x.odo||0)):(+D.car.odo||0)};
}
/* What fuel actually cost over the last 30 days, which is the number that
   should replace the budget line on Money. */
function fuelLast30(){
  const cut=ymd(new Date(Date.now()-30*86400000));
  return sum(D.fuel.filter(f=>f.date>=cut),f=>f.cost);
}

/* ═══ HOME — the day's page ═══════════════════════════════════ */
function renderHome(){
  const now=new Date(),ds=today(),ym=ymOf(ds),dayNow=now.getDate();

  const net=netPosition(),lines=monthlyLines();

  });
  D.debts.forEach(d=>{
    const c=debtCalc(d);
